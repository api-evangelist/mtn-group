aid: mtn-group
url: https://raw.githubusercontent.com/api-evangelist/mtn-group/refs/heads/main/apis.yml
name: MTN Group
kind: company
description: 'MTN Group is Africa''s largest mobile network operator, headquartered in Johannesburg, South
  Africa, serving roughly 290 million subscribers across around 16 markets in Africa. Beyond mobile voice,
  data and enterprise connectivity it runs MoMo, one of the continent''s largest mobile-money platforms. Unusually
  for a carrier, MTN publishes a genuinely open developer surface: the MTN Developer Platform (MADAPI) at developers.mtn.com
  lists 221 API products across 15 African markets and lets anyone download the OpenAPI/Swagger definition
  for a product without an account, and momodeveloper.mtn.com is a self-serve Azure API Management portal with
  a sandbox for the MoMo Collection, Disbursements and Remittance APIs. Its catalogue is heavily TM Forum Open
  API shaped (TMF620, TMF621, TMF622, TMF629, TMF632, TMF633, TMF635, TMF637, TMF639, TMF652, TMF654, TMF658,
  TMF666, TMF667, TMF676, TMF677, TMF678, TMF681, TMF683, TMF685, TMF688, TMF720). MTN South Africa is a GSMA
  Open Gateway participant — it announced Number Verification and SIM Swap with Cell C and Telkom in February
  2024 — but nothing in its published catalogue is CAMARA-shaped: its SIM Swap and Device Swap APIs are MTN-proprietary
  designs secured with OAuth2 client-credentials rather than the CAMARA OIDC/CIBA profile, and no CAMARA API
  is callable from either portal. MTN is not an Aduna shareholder. Sandbox access is self-serve; production
  access is vetted and commercially negotiated.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Telecommunications
