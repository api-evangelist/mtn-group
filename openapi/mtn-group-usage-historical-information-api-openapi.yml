openapi: 3.2.0
info:
  version: 1.0.0
  title: Customer Identification Usage Historical Information API
  description: "The Customer Identification API provides information about a customer and their historical usage events on voice, data, SMS, Roaming etc. Information can be retrieved by stating the date range for the period the API consumer is interested in. It will return date and time on which a specific event occurred on a customer's MSISDN as queried by the API consumer\n### Supported Operations\n\n  1. **Recharge and Usage Historical Information**\n      - **subscriberUsage:** Data, Voice, SMS call events\n            records\n      - **roamingUsage**: Data, Voice, SMS call events\n            records for Roaming\n      - **rechargeHistory:** Airtime Recharge Events\n      - **daUsageHistory:** Dedicated Account Balance usage\n      - **mainAccountUsage:** Events that used the Main Airtime\n      - **accountAdjustments:** Bucket Balance adjustment events that\n      happened on MA and DA's\n      - **internetUsageDetails:** Detailed Data usage events\n      - **validateKYC**: Validates whether msisdn and NIN values provided match or don't match\n \n  2. **Xtratime**\n      - View Loan Details: gets the list of open loans and their data for a subscriber of Xtratime product\n      - View Transaction Detail:  used to get a list of the history for loans (Advance/Recoveries) for a subscriber of xtratime product.\n      - Customer Eligibility: used to retrieve the list of denomination identifiers i.e. loan bands for which the subscriber is eligible at the time of the request.\n      - Customer Profile: used to retrieve the credit limit and balances list of the customer\n      \n  3. **Customer Information**\n      - Query Customer Data: Returns kyc and summary statistics on usage data for a subscriber msisdn. **Note, depending on the priviledges assigned to a 3PP all/less data is returned.**\n      - Query Merchant Data: Returns kyc and summary statistics on usage data for a momopay merchant msisdn. **Note, depending on the priviledges assigned to a 3PP all/less data is returned.**"
  contact:
    email: developer-support@mtn.com
    name: MTN API Support
servers:
- url: https://api.mtn.com/v1/customerIdentification/
security: []
tags:
- name: Usage Historical Information
paths:
  /customer:
    get:
      description: Get Usage, Roaming, Recharge History, Customer Profile or Eligibility status of a customer, identified by an MSISDN
      summary: Get Usage, Roaming, Recharge History, Customer Profile or Eligibility status of a customer, identified by an MSISDN
      tags:
      - Usage Historical Information
      operationId: GetUsage,Roaming,RechargeHistory,CustomerProfileorEligibilitystatusofacustomer,identifiedbyanMSISDN
      deprecated: false
      parameters:
      - name: customerId
        in: query
        required: true
        description: MSISDN of the customer
        schema:
          type: number
          format: double
      - name: partnerId
        in: query
        required: true
        description: Unique identifier of the system from which the request for customer information is coming. This is to be assigned by the back-end provider system
        schema:
          type: number
          format: double
      - name: operationName
        in: query
        required: true
        description: 'Name assigned to the task to be performed. Below are the possible values;

          - **subscriberUsage:** Data, Voice, SMS call events records

          - **roamingUsage:** Data, Voice, SMS call events records for Roaming

          - **rechargeHistory:** Airtime Recharge History

          - **daUsageHistory:** Dedicated Account Balance usage

          - **mainAccountUsage:** Events that used the Main Airtime

          - **accountAdjustments:** Bucket Balance adjustment events that

          happened on MA and DA''s

          - **internetUsageDetails:** Detailed Data usage events

          - **viewloandetailsCVAS:** gets the list of open loans and their data for a subscriber of Xtratime product

          - **viewtrxdetailsCVAS:** used to get a list of the history for loans (Advance/Recoveries) for a subscriber of xtratime product.

          - **checkEligibilityCVAS:** used to retrieve the list of denomination identifiers i.e. loan bands for which the subscriber is eligible at the time of the request.

          - **checkProfileCVAS:** used to retrieve the credit limit and balances list of the customer

          - **validateKYC:** confirm NIN and MSISDN are a match/no-match'
        schema:
          type: string
          enum:
          - subscriberUsage
          - roamingUsage
          - rechargeHistory
          - daUsageHistory
          - mainAccountUsage
          - accountAdjustments
          - internetUsageDetails
          - viewloandetailsCVAS
          - viewtrxdetailsCVAS
          - checkEligibilityCVAS
          - checkProfileCVAS
          - validateKYC
      - name: IdNumber
        in: query
        required: false
        description: NIN of the msisdn for which a match or no match is required . It is only applicable and mandatory if the operationName is set to validateKYC.
        schema:
          type: string
      - name: startDate
        in: query
        required: false
        description: 'Start Date from which information is required. Format; YYYYMMDD


          *Only applicable and mandatory when **operationName** = subscriberUsage, roamingUsage, rechargeHistory, daUsageHistory, mainAccountUsage, accountAdjustments, internetUsageDetails*'
        schema:
          type: number
          format: double
      - name: endDate
        in: query
        required: false
        description: 'End Date to which information is required. Format; YYYYMMDD


          *Only applicable when **operationName** = subscriberUsage, roamingUsage, rechargeHistory, daUsageHistory, mainAccountUsage, accountAdjustments, internetUsageDetails*'
        schema:
          type: number
          format: double
      - name: status
        in: query
        required: false
        description: 'Status of the loan


          *Only applicable when **operationName** = viewloandetailsCVAS*'
        schema:
          type: string
          enum:
          - open
          - closed
      - name: offset
        in: query
        required: false
        description: 'Indicates the max number of loan transaction to return. This is a limiter and can not exceed the project maximum.


          *Only applicable when **operationName** = viewtrxdetailsCVAS*'
        schema:
          type: number
          format: double
      - name: cvasBandName
        in: query
        required: false
        description: 'Specifies a specific loan band against which eligibility is checked.


          *Only applicable when **operationName** = checkEligibilityCVAS*'
        schema:
          type: string
      - name: cvasBandGroup
        in: query
        required: false
        description: 'Specifies the loan bands of the group against which eligibility is checked.


          *Only applicable when **operationName** = checkEligibilityCVAS*'
        schema:
          type: number
          format: double
      - name: responseType
        in: query
        required: false
        description: 'Specifies the level of information to return.


          *Only applicable when **operationName** = checkEligibilityCVAS*

          - B stands for "Basic". Returns Eligibility status only

          - E stands for "Extend". Returns Eligibility status and the list of eligible bands.'
        schema:
          type: string
          enum:
          - B
          - E
          default: E
      - name: eligibilityCheck
        in: query
        required: false
        description: 'Specifies the eligibility rules to run.


          *Only applicable when **operationName** = checkEligibilityCVAS*

          - B stands for "Basic". Without IN interaction

          - E stands for "Extend". With complete eligibility rules'
        schema:
          type: string
          enum:
          - B
          - E
          default: E
      - name: usageType
        in: query
        required: false
        description: 'Specifies the type of usage to be fetched.


          *Only applicable when **operationName** = subscriberUsage*.'
        schema:
          type: string
          enum:
          - ALL
          - VOICE
          - SMS
          - DATA
          default: ALL
