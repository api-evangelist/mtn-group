components:
  schemas:
    APIStatus:
      title: APIStatus
      type: object
      properties:
        msisdn:
          description: MSISDN of the customer whose information has been returned
          example: '256789999781'
          type: string
        requestId:
          description: internally generated transaction Id from the backend
          example: '4993609756309740126'
          type: string
        dateRange:
          description: Date range of the returned information
          type: array
          items:
            $ref: '#/components/schemas/DateRange'
        maxRecs:
          description: Maximum number of records available for the given date range
          type: integer
          format: int32
        numRecs:
          description: Number of records returned. 0 for no records returned.
          type: number
          format: double
        pageNum:
          type: object
          allOf:
          - $ref: '#/components/schemas/PageNum'
          - description: Maximum number of records that can be returned in a single response
        submittedTime:
          description: Date time stamp when the request for information was made
          example: 2020-09-01 17:08:38.549000
          type: string
        duration:
          description: Duration taken to process the request in milliseconds
          type: number
          format: double
        statusCode:
          description: Response status code
          example: 200
          type: number
          format: double
        statusMsg:
          description: Description for the response status code
          example: OK
          type: string
    DateRange:
      title: DateRange
      type: object
      properties:
        startdate:
          description: Format; YYYYMMDD
          type: string
        enddate:
          description: Format; YYYYMMDD
          type: string
    PageNum:
      title: PageNum
      description: Maximum number of records that can be returned in a single response
      type: integer
      format: int32
      enum:
      - 50
    customerUsage:
      title: customerUsage
      type: object
      properties:
        APIStatus:
          $ref: '#/components/schemas/APIStatus'
        APIData:
          description: Detailed information returned about the subscriber
          type: array
          items: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
