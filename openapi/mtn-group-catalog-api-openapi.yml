openapi: 3.2.0
info:
  title: Product Management Catalog API
  description: API to provide capability to manage catalog, category, Offerings, Offering price and specification of products.
  version: 1.0.0
servers:
- url: https://api.mtn.com/tmf-api/productcatalog/v1
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Catalog
paths:
  /catalog:
    get:
      operationId: listCatalog
      summary: List or find Catalog objects
      description: This operation list or find Catalog entities
      tags:
      - Catalog
      parameters:
      - name: transactionId
        in: header
        required: false
        description: Client generated Id to include for tracing requests.
        x-example: 6f0bece6-7df3-4da4-af02-5e7f16e5e6fc
        schema:
          type: string
      - name: Issellable
        in: query
        required: true
        description: ascertains whether the product is sellable or not
        schema:
          type: string
          enum:
          - true
          - false
      - name: category name
        in: query
        description: name of the product category
        required: true
        schema:
          type: string
          enum:
          - VAS
          - CUG
          - FNF
          - Devices
          - Accessories
          - ProviderActivation
          - SharedData
          - PoolShare
          - FixedShare
          - LoyaltyCatalog
          - GDS
      - name: lifecycle
        in: query
        required: false
        schema:
          type: string
          enum:
          - Launched
          - Active
          - Initial
          - Rejected
          - Retired
          - Obsolete
          - In design
      - name: business type
        in: query
        required: true
        schema:
          type: string
          enum:
          - Postpay
          - Prepay
      - name: depth
        description: used to expand inline referenced entities up to the level specified
        required: false
        in: query
        x-example: 4
        schema:
          type: integer
      - name: market segment
        description: name of the product market segment,e.g individual, Staff
        required: false
        in: query
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: fields to be included in the response, name, id, url
        x-example: name
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Response_Catalog'
                type: array
                items:
                  type: object
