      - name: targetSystem
        in: header
        required: true
        schema:
          type: string
      - name: deviceIp
        in: header
        required: false
        schema:
          type: string
      - name: portName
        in: header
        required: false
        schema:
          type: string
      - name: deviceSerialNumber
        in: header
        required: false
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
