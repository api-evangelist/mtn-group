  /customers/{customerId}/biometric/verify:
    post:
      tags:
      - Customer KYC
      summary: Verify customer kyc information by uploading customer biometric data
      description: This endpoint is to enable trusted partners verify customer's KYC information by passing customer biometric details
      parameters:
      - name: customerId
        in: path
        description: ID of the customer. It could be MSISDN, email address, or any other customer identifier. if customerId is msisdn, then the format must be E.123
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        description: Transaction Id for tracking purposes
        required: false
        schema:
          type: string
      - name: targetSystem
        in: header
        description: Target system
        required: false
        x-example: BIOSMART, NIBSS
        schema:
          type: string
      - name: requestType
        in: query
        description: The type of request to be made ie. whether it's a Face match or fingerprint verification,  Required to be passed when targetSystem is NIBSS
        required: false
        schema:
          type: string
          enum:
          - FINGERPRINT_MATCH
      - name: verificationType
        in: query
        required: false
        description: Defines the type of verification 3PP wants to perform base on the passed payload ie. Whether it's a finger print, fingerprint with date of birth verification etc.  Required to be passed when targetSystem is NIBSS
        schema:
          type: string
          enum:
          - FINGERPRINT_PHONENUMBER
      responses:
        '200':
          description: Callback Success Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BIOMetricResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '5000'
                - $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '4000'
                - $ref: '#/components/schemas/ErrorPayload'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '4001'
                - $ref: '#/components/schemas/ErrorPayload'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '1000'
                - $ref: '#/components/schemas/ErrorPayload'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '3000'
                - $ref: '#/components/schemas/ErrorPayload'
        '406':
          description: Not acceptable
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '3000'
                - $ref: '#/components/schemas/ErrorPayload'
        '415':
          description: Unsupported media Type
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '3000'
                - $ref: '#/components/schemas/ErrorPayload'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '3000'
                - $ref: '#/components/schemas/ErrorPayload'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceMatchingRequest'
        description: Request body
        required: true
  /biometric-roc/customers/identityStatus:
    post:
      tags:
