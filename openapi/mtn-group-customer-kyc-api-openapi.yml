              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '3000'
                - $ref: '#/components/schemas/ErrorPayload'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '3000'
                - $ref: '#/components/schemas/ErrorPayload'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicKYCRequestData'
        description: Request body
        required: true
    get:
      security:
      - basicAuth: []
      tags:
      - Customer KYC
      summary: Verify if customer MSISDN is active on either the bank or MTN
      description: This endpoint is to enable a 3PP confirm if a mobile number is active on the bank and to get a hashed mobile number
      parameters:
      - name: customerId
        in: path
        description: customer MSISDN that is to be confirmed
        required: true
        schema:
          type: string
      - name: transactionId
        in: query
        description: transactionId for tracking purposes
        schema:
          type: string
      - name: verificationType
        in: query
        description: Verification Type.
        schema:
          type: string
          enum:
          - BANK
          - HASHCODE
          - EVALIDATOR
          - WinBack
          - VALENTINE_PROMO
      - name: targetSystem
        in: query
        schema:
          type: string
          enum:
          - DAAS
          - CLM
          - BANK_BILLING
          - CLM_REST
          - NIBSS
      - name: externalCode
        in: query
        description: This can be the bank's short code
        schema:
          type: string
      - name: startDate
        in: query
        description: An optional parameter, together with endDate, allows developers to specify a time range by which to query customer data on. If you want to request data for 2 months, then start date will need to set to 2 months prior to today, and endDate to todays date. If this is not set, the date range will be defaulted to 6 months
        schema:
          type: string
      - name: endDate
        in: query
        description: An optional parameter, together with startDate, allows developers to specify a time range by which to query customer data on. If you want to request data for 2 months, then start date will need to set to 2 months prior to today, and endDate to todays date. If this is not set, the date range will be defaulted to 6 months
        schema:
          type: string
      responses:
        '200':
          description: Successful verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerVerificationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '5000'
                - $ref: '#/components/schemas/ErrorPayload'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '4000'
                - $ref: '#/components/schemas/ErrorPayload'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '4001'
                - $ref: '#/components/schemas/ErrorPayload'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    statusCode:
                      type: string
                      description: MADAPI canonical code for success
                      example: '1000'
                - $ref: '#/components/schemas/ErrorPayload'
        '405':
