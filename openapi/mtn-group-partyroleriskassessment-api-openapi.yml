          type: string
          description: Biometrics colour for the application (“Green”/ ”Yellow”).
          example: Yellow
        currentOrderDetails:
          title: orderDetails
          type: object
          properties:
            orderLineCount:
              type: string
              description: Current Order - Number of contracts taken up
            orderNumber:
              maxLength: 30
              type: string
              description: unique identifier for an order Mandatory for orderType="Prepaid" Optional for orderType="Postpaid"
            currentOrderLineItems:
              type: array
              items:
                type: object
                properties:
                  orderOffsetMRC:
                    type: string
                    description: Current Order - Voluntary and Mandatory Upfront payment distributed to reduce total MRC
                  orderSPUL:
                    type: string
                    description: Positive value representing the Total out of bundle spend required on all contract summed up
                  msisdn:
                    type: string
                    description: Needs to be sent where applicationType = “Upgrade”
                  dealID:
                    type: string
                    description: Deal Id of the Product
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        productid:
                          type: string
                          description: The code associated with the product the applicant has selected e.g. “1234”
    address:
      type: object
      properties:
        addressType:
          type: string
          description: The address Type (“Residential” / “Delivery”)
          example: Residential
        addressLine1:
          type: string
          description: Line 1 of the address
          example: 52 Street
        addressLine2:
          type: string
          description: Line 2 of the address
          example: LOVELY AREA
        suburb:
          type: string
          description: Suburb of the address
          example: ILLOVO
        city:
          type: string
          description: City of the address
          example: Cape Town
        province:
          type: string
          description: Province of the address
          example: GP
        postalCode:
          type: string
          description: Postal of the address
          example: 2196
