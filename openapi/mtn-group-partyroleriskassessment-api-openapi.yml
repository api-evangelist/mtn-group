                creditLimit:
                  type: number
                  format: float
                  description: Credit amount provided to applicant, -1 will be given when a decline
    PartyRoleRiskAssessment_Create:
      type: object
      properties:
        requestedStartDate:
          type: string
          format: date-time
          description: Date and Timestamp of the requesting system.  Java Zoned Date and time - Africa/Johannesburg (UTC+02:00)
        channel:
          required:
          - id
          type: array
          items:
            type: object
            properties:
              name:
                maxLength: 30
                type: string
                description: The name of the requesting channel
                enum:
                - Online
                - Store
                - TeleSales
              role:
                type: string
                description: Role playing by the channel.
        merchantType:
          maxLength: 1
          type: string
          description: is this request for MTN or an external party "I" - Internal MTN request, "E" - External request (future)
          enum:
          - I
          - E
        orderDetails:
          title: orderDetails
          type: array
          description: Array of order details
          items:
            required:
            - subscriptionType
            type: object
            properties:
              subscriptionType:
                maxLength: 30
                type: string
                description: the type of order that the request relates to "Postpaid" - Postpaid Contract, "Prepaid" - Prepaid Sale/Purchase e.g. Prepaid Sales, Bundle Add-On
                enum:
                - Prepaid
                - Postpaid
              orderNumber:
                maxLength: 30
                type: string
                description: unique identifier for an order Mandatory for orderType="Prepaid" Optional for orderType="Postpaid"
              application:
                required:
                - applicationType
                - customerType
                - customerClass
                type: object
                properties:
                  applicationType:
                    maxLength: 30
                    type: string
                    description: Type of application being processed  "New"/"Upgrade"/"Addsim"/"M2M" New - If the applicant has not had an account with MTN previously and is a completely new/first time applicant. Applicant without an active postpaid account Upgrade - If the applicant is an existing MTN customer that wants to upgrade his contract `          Addsim - If the applicant is an existing MTN customer and wants to add an additional SIM onto his current contract M2M (Month-to-month)- If the applicant is an existing MTN customer and has now opted for a month-to-month postpaid contract, with payment in advance and can terminate at any time. If the applicant is a new/existing MTN customer and has now opted for a month-to-month new postpaid contract, with payment in advance and can terminate at any time (possible device cost  claw back)
                    enum:
                    - New
                    - Addsim
                    - Upgrade
                    - M2M
                  customerType:
                    maxLength: 30
                    type: string
                    description: ID to denote the Customer Type "CONS” = Consumer-CBU, “ECON” = Employee Connect-EBU, “STAFF” = Staff-CBU This value is to define the specific order application.
                    enum:
                    - CONS
                    - ECON
                    - STAFF
                  customerClass:
                    maxLength: 30
                    type: string
                    description: for CustomerType = "CONS", CustomerClass- CONS (default)/M2M. for CustomerType = “ECON” , CustomerClass- ECON (default)/M2M. for CustomerType = “STAFF”, CustomerClass- “STAFF”
                    enum:
                    - CONS
                    - ECON
                    - STAFF
                    - M2M
        partyRole:
          required:
          - party
          type: object
          properties:
            type:
              maxLength: 30
              type: string
              description: Individual or Enterprise
              enum:
              - Individual
              - Enterprise
        fraudCheckType:
          type: string
          description: The fraud type request to be executed A - DeviceVerfication B - WatchList, FPM&SAFPS, Mobile Verfication C - EmailVerification D - MTNInternalHotList E - MobileVerfication
          example: A,B,C,D
        relatedParty:
          required:
          - firstName
          - lastName
          - idType
          - idNumber
          - dateOfBirth
          - gender
          type: object
          properties:
            idType:
              type: string
              description: The ID type being used to create the profile.  Possible Values are ''RSAID'', ''PASSPORT'''. This field is mandatory while creating a customer.
              enum:
              - RSAID
              - PASSPORT
            idNumber:
              maxLength: 30
              type: string
              description: Id number based on ID type. This field is mandatory while creating a customer.
            firstName:
              maxLength: 30
              type: string
              description: 'First full name of the subscriber as per RSA ID or Passport. This field is mandatory while creating a customer.  '
            lastName:
              maxLength: 30
              type: string
              description: Surname name of the subscriber as per RSA ID or Passport. This field is mandatory while creating a customer. Character length 50
            gender:
              type: string
              description: subscriber's Gender. This field is mandatory while creating a customer.
              enum:
              - M
              - F
              - O
            dateOfBirth:
              maxLength: 10
              type: string
              description: subscriber's date of birth. This field is mandatory while creating a customer. Date Format "YYYY-MM-DD"
              format: date
    fullVetAssessment:
      type: object
      properties:
        applicationId:
          type: string
          description: Application reference number
        requestedStartDate:
          type: string
          format: date-time
          description: Date and Timestamp of the Request start time in the Provenir system.  Java Zoned Date and time - Africa/Johannesburg (UTC+02:00)
