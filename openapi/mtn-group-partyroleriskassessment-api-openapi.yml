          example: A,B,C,D
        relatedParty:
          type: object
          properties:
            email:
              type: string
              description: Contact email address for the applicant.
            firstName:
              maxLength: 30
              type: string
              description: 'First full name of the subscriber as per RSA ID or Passport. This field is mandatory while creating a customer.  '
            lastName:
              maxLength: 30
              type: string
              description: Surname name of the subscriber as per RSA ID or Passport. This field is mandatory while creating a customer. Character length 50
            gender:
              type: string
              description: subscriber's Gender. This field is mandatory while creating a customer.
              enum:
              - M
              - F
              - O
            dateOfBirth:
              maxLength: 10
              type: string
              description: subscriber's date of birth. This field is mandatory while creating a customer. Date Format "YYYY-MM-DD"
              format: date
            surname:
              type: string
              description: Surname of the subscriber
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/address'
            phones:
              type: array
              items:
                $ref: '#/components/schemas/phone'
            dealerCode:
              type: string
              description: SABC code of originating dealer
            agentID:
              type: string
              description: ID of originating Agent
            ipAddress:
              type: string
              description: IPV4 or IPV6 address from where the transaction is being submitted
            blackboxString:
              type: string
              description: Iovation black box value (generated via JavaScript on web/SDK on app).Encoded string up to 4KB.
    AffordabilityRequest:
      type: object
      properties:
        applicationId:
          type: string
          description: Unique identifier of the application
        requestedStartDate:
          type: string
          format: date-time
          description: Date and Timestamp of the Provenir system.  Java Zoned Date and time - Africa/Johannesburg (UTC+02:00)
        price:
          type: object
          description: Provides all amounts (tax included, duty free, tax rate)
          properties:
            dutyFreeAmount:
              $ref: '#/components/schemas/Money'
              description: All taxes excluded amount (expressed in the given currency)
            taxIncludedAmount:
              $ref: '#/components/schemas/Money'
              description: All taxes included amount (expressed in the given currency)
            additionalAmount:
              $ref: '#/components/schemas/Money'
              description: Positive value representing the amount of additional income provided by customer. This should be a monthly amount.
        billingAccount:
          description: Bank statement details that are uploaded for Bank Statement raw data retrieval.
          type: array
          items:
            type: object
            properties:
              bankAccountNo:
                type: string
                description: Bank account number
              bankAccountType:
                type: string
                description: Applicant Bank Account Type 'Savings' 'Current' 'Credit Card' e.g. “Savings” Default to blank if unavailable.
              branchCode:
                type: string
                description: Branch Code of the Bank in which the Bank Account is held.  Default to zero if unavailable.
              bankName:
                type: string
                description: Name of applicant Bank
              totalIncome:
                type: number
                format: float
                description: Positive value representing the Total Income verified from the Bank Statement raw data e.g. 58000.50 Default to zero if unavailable.
              totalExpense:
                type: number
                format: float
                description: Positive value representing the Total Expenses verified from the Bank Statement raw data e.g. 6000.75 Default to zero if unavailable.
              bouncedDebitOrders:
                type: number
                description: Total bounced debit orders verified from the Bank Statement raw data.  Default to zero if unavailable.
