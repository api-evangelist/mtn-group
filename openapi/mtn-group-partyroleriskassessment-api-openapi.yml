  /partyRoleRiskAssessment/avs:
    get:
      summary: AVS Decision
      description: This operation creates a PartyRoleRiskAssessment entity
      tags:
      - partyRoleRiskAssessment
      parameters:
      - name: applicationId
        in: query
        required: true
        schema:
          type: string
      - name: startDate
        description: The date and time when the calling system submits the request to Provenir.
        required: true
        in: query
        schema:
          type: string
          format: date-time
      - name: bankAccountNo
        in: query
        description: Bank account number for AVS
        schema:
          type: string
      - name: bankName
        in: query
        description: Name of applicant’s Bank
        schema:
          type: string
      - name: bankAccountType
        in: query
        schema:
          type: string
          enum:
          - Savings
          - Current
          - CreditCard
          default: Savings
      - name: branchCode
        in: query
        description: Branch Code of the Bank in which the Bank Account is held
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/avsResponse'
        '400':
          description: Bad Request
          content:
