  /iotDevice:
    post:
      tags:
      - TMF908 IoT Device Management
      summary: IoT Device TAC Validation
      description: This operation performs TAC (Type Allocation Code) validation for
        IoT devices through the NMS system. The endpoint handles device requests with
        comprehensive transaction tracking and response logging.
