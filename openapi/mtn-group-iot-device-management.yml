  /resourceSpecification:
    post:
      tags:
      - TMF908 IoT Device Management
      summary: Push Internet Settings
      description: This operation pushes internet settings for IoT devices through
        resource specification management. The endpoint supports XMF device compatibility
        checks and both UGA and system layer routing with comprehensive transaction
        tracking.
      operationId: Tmf908IotDeviceManagementAggregatorService_post_pushInternetSettings_resourceSpecificatio
