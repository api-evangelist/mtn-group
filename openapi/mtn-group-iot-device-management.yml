                    properties:
                      name:
                        type: string
                      id:
                        type: string
                      value:
                        type: string
                description:
                  type: string
                id:
                  type: string
                relatedParty:
                  type: array
                  items:
                    title: RelatedParty
                    type: object
                    properties:
                      name:
                        type: string
                      id:
                        type: string
        required: true
      responses:
