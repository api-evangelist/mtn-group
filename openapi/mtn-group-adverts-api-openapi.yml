components:
  schemas:
    SMSResponse:
      title: content
      properties:
        main:
          type: object
          properties:
            imgUrl:
              type: string
            imgText:
              type: string
            title:
              type: string
            imageLink:
              type: string
        error:
          type: object
          properties:
            code:
              type: string
    PCMData:
      properties:
        data:
          $ref: '#/components/schemas/PCMResponse'
    WebResponse:
      title: content
      properties:
        main:
          type: object
          properties:
            imgUrl:
              type: string
            imgText:
              type: string
            title:
              type: string
            imageLink:
              type: string
        error:
          type: object
          properties:
            code:
              type: string
    PCMResponse:
      title: content
      properties:
        adNmame:
          type: object
          properties:
            adValid:
              type: boolean
              example: true
            imgUrl:
              type: string
            clickUrl:
              type: string
            adText:
              type: string
            adId:
              type: integer
            pcmTransId:
              type: string
            MarbilTransId:
              type: integer
    WebData:
      properties:
        data:
          $ref: '#/components/schemas/WebResponse'
    SMSData:
      properties:
        data:
          $ref: '#/components/schemas/SMSResponse'
