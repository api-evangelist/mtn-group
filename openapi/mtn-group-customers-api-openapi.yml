components:
  schemas:
    LoanStatusResponse:
      type: object
      properties:
        statusCode:
          type: string
          description: Status Code
        statusMessage:
          type: string
          description: Status Message
        transactionId:
          type: string
          description: Client or API generated Id to include for tracing requests
        data:
          type: object
          properties:
            status:
              type: string
              enum:
              - COMPLETED
              - FAILED
              - INITED
              - PARTIAL_EXECUTED
            timestamp:
              type: string
              description: Execution timestamp. example 1519980450143
        _links:
          type: object
          properties:
            self:
              type: string
              example: https://api.mtn.com/v1/customers/2348076891321/loans/advance/status
    LoanAdvanceResponse:
      type: object
      properties:
        statusCode:
          type: string
        statusMessage:
          type: string
          description: Status Message
        transactionId:
          type: string
          description: API generated Id to include for tracing requests
        loanDetails:
          $ref: '#/components/schemas/LoanProvisioningDetails'
        _links:
          type: object
          properties:
            self:
              type: string
              example: https://api.mtn.com/v1/customers/2348076891321/loans/advance
    Amount:
      type: object
      properties:
        bundleName:
          type: string
          description: Name of eligible loan bundle
        bundleValue:
          type: string
          description: Name of eligible loan bundle value
        validity:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - HOURLY
        amount:
          type: number
          description: Price of loan bundle
    LoanEligibilityTypes:
      type: object
      properties:
        eligibilityType:
          type: string
          enum:
          - Airtime
          - Data
          - Voice
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/Amount'
    LoanProvisioningDetails:
      type: object
      properties:
        bundleName:
          type: string
          description: Name of eligible loan bundle value
        bundleValue:
          type: string
          description: Name of eligible loan bundle value
        amount:
          type: number
          description: Price of loan bundle
        bundleType:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - HOURLY
    Error:
      type: object
      required:
      - statusCode
      - statusMessage
      properties:
        statusCode:
          type: string
          description: This is the MADAPI Canonical Error Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system errors are mapped to specific canonical error codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'
          example: '1000'
        statusMessage:
          type: string
          description: More details and corrective actions related to the error which can be shown to a client
        supportMessage:
          type: string
          description: Internal message meant for consumers of the API to troubleshoot the error (could possible include the back-end system error code in the message if it would be useful)
        transactionId:
          type: string
          description: This is the same transactionId that is sent in the request
        timestamp:
          type: string
          format: date-time
          description: Timestamp that the error occurred
          example: 2020-08-01T12:34
        path:
          type: string
          description: The path that caused the error
          example: /loans/2348024008124/...
    EligibilityResponse:
      title: Eligibility
      type: object
      properties:
        statusCode:
          type: string
          description: Status Code
        statusMessage:
          type: string
          description: Status Message
        transactionId:
          type: string
          description: API generated Id to include for tracing requests
        eligibilityStatus:
          type: string
          enum:
          - ELIGIBLE
          - NE_LOAN
          - NE_TCL_REACHED
          - NOT_ELIGIBLE
          - HAS_LOAN_BALANCE
          - HAS_QUEUED_REQUEST
          - QUALIFIED_BUT_HAS_REACHED_MAXIMUM_LANDABLE_AMOUNT
          - INVALID_SUBSCRIBER_NUMBER
          - MISSING_PARAMETERS
        eligible:
          type: array
          items:
            $ref: '#/components/schemas/LoanEligibilityTypes'
        _links:
          type: object
          properties:
            self:
              type: string
              example: https://api.mtn.com/v1/customers/2348076891321/loans/eligibleBungles
    CustomerLocations:
      type: object
      required:
      - _link
      properties:
        data:
          type: object
          $ref: '#/components/schemas/Locations'
        _link:
          type: string
          description: The link to retrieve the location of customer
          $ref: '#/components/schemas/CustomerLinks'
          example: https://api.mtn.com/v1/customers/27832000000/locations
    ErrorDefault:
      properties:
        error:
          type: string
        error_description:
          type: string
    Locations:
      type: object
      required:
      - country
      - homeNetwork
      - operator
      properties:
        country:
          type: string
          description: The country that the customer MSISDN is currently located in, and could be roaming in. ISO 3166-1 short name format
          example: South Africa
        homeNetwork:
          type: string
          description: The country that the customer MSISDN was provisioned in. ISO 3166-1 short name format
          example: South Africa
        operator:
          type: string
          description: The network operator that the customer MSISDN is currently located in.
          enum:
          - MTN
          - Other
          - 'null'
          example: MTN
    CustomerLinks:
      type: object
      required:
      - self
      properties:
        self:
          type: object
          required:
          - href
          description: ''
          properties:
            href:
              type: string
              description: ''
    Error_2:
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error response code
        status:
          type: string
          description: Text explaining the reason for the error
        error:
          type: string
        message:
          type: string
          description: More error details and corrective measures
        path:
          type: string
          description: ''
    Error400:
      properties:
        statusCode:
          type: integer
          description: Status code from target system to indicate transaction status
        statusMessage:
          type: string
          description: Status message from target system to indicate transaction status.
        supportMessage:
          type: string
          description: detail message from target system to indicate transaction status.
        transactionId:
          type: string
          description: This is the same transactionId that is sent in the request
          example: 0d1e1b18-1b6d-4792-8417-72d337f42a1c
        links:
          type: array
          items:
            properties:
              rel:
                type: string
              href:
                type: string
    UpdateFRIResponse:
      type: object
      properties:
        statusCode:
          type: string
          example: '0000'
          description: This is the MADAPI Canonical Error Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system errors are mapped to specific canonical error codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'
        statusMessage:
          type: string
          description: More details and corrective actions related to the error which can be shown to a client
          example: Success
        supportMessage:
          type: string
          description: Internal message meant for consumers of the API to troubleshoot the error (could possible include the back-end system error code in the message if it would be useful)
          example: FRI Unblock Successful
        transactionId:
          type: string
          description: This is the same transactionId that is sent in the request
          example: '234321456789'
    Plans:
      type: object
      required:
      - type
      - status
      - startDate
      - endDate
      - language
      - tariffPlan
      - balance
      description: The plan details for the customer.
      properties:
        offers:
          $ref: '#/components/schemas/OfferDetails'
        type:
          type: string
          description: The billing type of the plan.
          enum:
          - Prepaid
          - Postpaid
          - Hybrid
        status:
          type: string
          description: The current status of the plan.
          enum:
          - Active
          - Suspended
          - Inactive
          - RICA Barred
          - Blacklisted
        startDate:
          type: string
          description: The date the customer was created/provisioned
          format: date-time
        customerType:
          type: string
          description: To return the customer type of the number. E.g Staff, Contractor, etc.
          example: Staff
        endDate:
          type: string
          description: The date the plan will be deactivated.
          format: date-time
        language:
          type: string
          description: The customers language.
        tariffPlan:
          type: string
          description: The customers active tariff plan.
        balance:
          type: array
          description: The account balance details of a customer
          items:
            $ref: '#/components/schemas/CustomerBalance'
        usageCounterAndThreshold:
          type: array
          description: Usage counter usage threshold
          items:
            $ref: '#/components/schemas/UsageCounterUsageThreshold'
        accumulator:
          type: array
          description: Customer accumulators
          items:
            $ref: '#/components/schemas/Accumulator'
    LoyaltyBalances:
      type: object
      description: Contains all the loyalty balances associated with a customer.
      properties:
        generatedAmount:
          $ref: '#/components/schemas/Amount_2'
        consumedAmount:
          $ref: '#/components/schemas/Amount_2'
        newBalance:
          $ref: '#/components/schemas/Amount_2'
    BalanceDetail:
      type: object
      required:
      - type
      - activeValue
      - activeUnit
      description: The details for a balance type.
      properties:
        type:
          type: string
          description: This is the type of the value.
          enum:
          - CURRENCY
          - DATA
          - MINUTES
          - SMS
        activeValue:
          type: string
          description: This is the aggregated formatted active value of a balance type.
        activeUnit:
          type: string
          description: This is the unit of the aggregated active value.
          enum:
          - ZAR
          - NGN
          - GB
          - MB
          - MINUTES
          - SMS
        unusedValue:
          type: string
          description: This is the aggregated formatted unused value of a balance type.
          example: 45.25
        unusedUnit:
          type: string
          description: This is the unit of the aggregated unused value.
          enum:
          - ZAR
          - NGN
          - GB
          - MB
          - MINUTES
          - SMS
          example: NGN
    UsageThreshold:
      type: object
      properties:
        id:
          type: string
          example: '622'
