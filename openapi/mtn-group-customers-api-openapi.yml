      type: object
      properties:
        id:
          type: string
          example: 41
        name:
          type: string
          description: accumulator name
          example: 10MB Daily Plan
        value:
          type: string
          description: Accumulator value
          example: 264844
        unit:
          type: string
          description: accumulator value
          example: NGN
    Error401:
      properties:
        statusCode:
          type: integer
          description: Status code from target system to indicate transaction status
          example: 4000
        statusMessage:
          type: string
          description: Status message from target system to indicate transaction status.
          example: Unauthorised
        supportMessage:
          type: string
          description: detail message from target system to indicate transaction status.
          example: Please verify token environment and key
        faultMessage1:
          type: string
