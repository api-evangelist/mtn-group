        name:
          type: string
          example: 10MB Daily Plan
          description: Product name
        value:
          type: string
          example: '-738586'
        unit:
          type: string
          description: Currency unit
          example: NGN
    GetFRIRequest:
      type: object
      properties:
        accountHolderId:
          type: string
        extension:
          type: object
        resource:
          type: string
      title: GetFRIRequest
