openapi: 3.2.0
info:
  title: Mtn Group Customer API
  version: '1.0'
  description: 'Operations tagged Customer across 5 of this provider''s published API definitions: mtn-group-customer-survey.yml, mtn-group-mtn-customer-kyc-api-v1-product.yml, mtn-group-mtn-nigeria-customer-datashare.yml, mtn-group-mtn-nigeria-data-gifting-v1.yml, mtn-group-tmf629-customer-management.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.mtn.com/v1/survey
- url: https://api.mtn.com/v1/customers
- url: https://api.mtn.com/v1/datashare
- url: https://api.mtn.com/v1/datagifting
- url: https://serverRoot/tmf-api/customerManagement/v4/
tags:
- name: Customer
paths:
  /customers/{customerId}:
    get:
      tags:
      - Customer
      summary: Get Survey Quetions
      description: Fetch Survey Questions and Options.
      parameters:
      - name: customerId
        in: path
        description: Source Msisdn. The format must be E.123
        required: true
        schema:
          type: string
      - name: surveyId
        in: query
        required: false
        description: The unique ID of a particular survey
        schema:
          type: string
      - name: targetSystem
        in: query
        schema:
          type: string
          enum:
          - CLM
          - DIGISURVEY
          - CLM_REST
      - name: surveyType
        in: query
        schema:
          type: string
          enum:
          - eValidator
          - SHARENSELL
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: string
                    description: This is the MADAPI Canonical response Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system response are mapped to specific canonical response codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'
                  statusMessage:
                    type: string
                    description: Status Message
                  transactionId:
                    type: string
                    description: API generated Id to include for tracing requests
                  data:
                    $ref: '#/components/schemas/DataResponse'
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: https://api.mtn.com/v1/survey/customers/23464618463
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method No Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ApiKeyAuth: []
    post:
      tags:
      - Customer
      summary: Submit Survey and more KYC Answers
      description: Submit a list of questions and answers to survey.
      parameters:
      - name: surveyId
        in: header
        description: unique ID generated for each transaction
        required: false
        schema:
          type: string
      - name: surveyType
        in: header
        description: Survey type
        required: false
        schema:
          type: string
      - name: countryCode
        in: header
        description: Survey type
        required: false
        schema:
          type: string
      - name: customerId
        in: path
        description: Source Msisdn. The format must be E.123
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: string
                    description: This is the MADAPI Canonical response Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system response are mapped to specific canonical response codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'
                  statusMessage:
                    type: string
                    description: Status Message
                  transactionId:
                    type: string
                    description: API generated Id to include for tracing requests
                  data:
                    $ref: '#/components/schemas/DataResponse'
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: https://api.mtn.com/v1/survey/customers/23464618463
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method No Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - answers
              properties:
                hash:
                  type: string
                  example: Wk68gjJxucqM4qxTYCNH94TMid0KhIaE
                  description: The unique hash identifier for submiting a survey answer
                targetSystem:
                  type: string
                  example: DIGISURVEY
                  enum:
                  - CLM
                  - DIGISURVEY
                  - CLM_REST
                  - GENESIS
                surveyType:
                  type: string
                  enum:
                  - SHARENSELL
                  - eValidator
                servicePlan:
                  type: string
                  description: This is the service class of the customerId submiting survey answers
                answers:
                  type: array
                  description: The list of answered questions
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      message:
                        type: string
                      input:
                        type: string
        required: true
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.mtn.com/v1/survey
