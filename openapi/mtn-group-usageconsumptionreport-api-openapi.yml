openapi: 3.2.0
info:
  title: Mtn Group Usage Consumption Report API
  version: '1.0'
  description: 'Operations tagged usageConsumptionReport across 2 of this provider''s published API definitions: mtn-group-tmf-usage-consumption-tmf677.yml, mtn-group-usage-consumption.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.mtn.com/usageConsumption/v1/
tags:
- name: usageConsumptionReport
paths:
  /usageConsumptionSummary/{id}:
    get:
      operationId: retrieveUsageConsumptionSummary
      summary: Retrieves a usage consumption summary of a subscriber
      description: This operation is used to retrieve usage consumption summary/report of a subscriber.
      tags:
      - usageConsumptionReport
      parameters:
      - name: transactionId
        in: header
        required: true
        description: Client generated Id to include for tracing requests.
        x-example: 6f0bece6-7df3-4da4-af02-5e7f16e5e6fc
        schema:
          type: string
      - name: countryCode
        in: header
        required: false
        description: Will be used internally by application
        schema:
          type: string
      - name: id
        required: true
        in: path
        description: 'Subscriber ID/ MSISDN of a customer for which usage consumption report to be fetched. example: 250789123456'
        x-example: '250788123456'
        schema:
          type: string
      - name: usageType
        required: false
        in: query
        description: Type of usage concerned by the bucket, such as voice, sms, data
        schema:
          type: string
          enum:
          - All
          - mainBalance
          - currencyBalance
          - Voice
          - Data
          - SMS
      - name: senderID
        required: false
        in: query
        description: Identifies the source system which integrates with MAD API
        schema:
          type: string
      - name: queryMode
        required: false
        in: query
        description: Query mode for which the request is to be returned, pass 0 or this will be assisgned a default value(0)
        schema:
          type: string
      - name: x-origin-channel-id
        required: false
        in: header
        description: The channel consuming the API e.g. chatbot
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ResponseUsageConsumptionSummary'
        '400':
          description: Bad Request
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not allowed
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - OAuth2: []
      - ApiKeyAuth: []
    servers:
    - url: https://api.mtn.com/usageConsumption/v1/
