    - url: https://api.mtn.com/usageConsumption/v1/
components:
  schemas:
    Error:
      type: object
      title: Error
      required:
      - status
      - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time stamp of the error
        status:
          type: string
          description: Status/Error code returned from the provider system
        error:
          type: string
          description: Status/Error description
        message:
          type: string
          description: More error details and corrective measures
        path:
          type: string
          description: the path that caused the error
    UsageVolumeBalance:
      type: object
      description: The balance (called UsageVolumeBalance in the SID model) defines the remaining allowed product usage quantity in terms of volume, time, currency or events. It corresponds to the initial allowed usage quantity minus the usage consumed on the bucket.
      properties:
        initialValue:
          $ref: '#/components/schemas/Quantity'
          description: Numeric initial value for the bucket given in the unit (for example 1.9). This numeric value could be used for calculation for example
        usedValue:
          $ref: '#/components/schemas/Quantity'
          description: Numeric used value for the bucket given in the unit (for example 1.9). This numeric value could be used for calculation for example
        remainingValue:
          $ref: '#/components/schemas/Quantity'
          description: Numeric remaining value for the bucket given in the unit (for example 1.9). This numeric value could be used for calculation for example
        validFor:
          $ref: '#/components/schemas/TimePeriod'
          description: Balance period between a start date time and an end date time. For prepaid bucket, the period of the balance is between the  effective date of the usage consumption report generation and the end date of the bucket. For postpaid bucket, the period of the balance is between the effective date of the usage consumption report generation and the next bill date.
        currencyId:
          type: string
          description: Currency ID
          example: '1185'
        currencyName:
          type: string
          description: Name of the currency
          example: SSD
    UsageConsumptionSummary:
      type: object
      description: An usage consumption report enables to know at a given point the balances and the consumption counters related to various buckets (SMS, Voice, Data for example).
      properties:
        id:
          type: string
          description: Unique identifier
        type:
          type: string
          description: Type of unique identifier.
        description:
          type: string
          description: Description of the entity
        name:
          type: string
          description: Name of the entity.
        subscriberType:
          type: string
          description: Type of subscriber such as Prepaid, Postpaid, Hybrid etc.
          enum:
          - Prepaid
          - Postpaid
          - Hybrid
        usageType:
          type: string
          description: Type of usage concerned by the bucket, such as voice, sms, data
        bucket:
          type: array
          items:
            $ref: '#/components/schemas/UsageVolumeProduct'
          description: Bucket(s) included in the offer or option subscribed.
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        endDateTime:
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
        startDateTime:
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format. If you define a start, you must also define an end
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          default: 1
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    UsageVolumeProduct:
      type: object
      description: A bucket (called UsageVolumeProduct in the SID model) represents a quantity of usage, as 2 hours national calls or 50 sms for example. It could be either a quantity or an amount in a currency (i.e. It could represent a fixed number of SMS, MMS, minutes of calls, quantity of data, number of events as well as a specific amount in a given currency). It requires one or more network products from which usages will debit the bucket.
      properties:
        id:
          type: string
          description: Unique identifier of the bucket
        name:
          type: string
          description: Bucket name
        description:
          type: string
          description: Description of the relative entity.
        type:
          type: string
          description: This is the type of relative entity.
        bucketBalance:
          type: array
          items:
            $ref: '#/components/schemas/UsageVolumeBalance'
    UsageConsumptionDetailedReport:
      type: object
      description: An usage consumption report enables to know at a given point the balances and the consumption counters related to various buckets (SMS, Voice, Data for example).
      properties:
        id:
          type: string
          description: Unique identifier
        type:
          type: string
          description: Type of unique identifier.
        description:
          type: string
          description: Description of the entity
        name:
          type: string
          description: Name of the entity.
        subscriberType:
          type: string
          description: Type of subscriber such as Prepaid, Postpaid, Hybrid etc.
          enum:
          - Prepaid
          - Postpaid
          - Hybrid
        usageType:
          type: string
          description: Type of usage concerned by the bucket, such as voice, sms, data
        bucket:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
          description: Bucket(s) included in the offer or option subscribed.
    ResponseUsageConsumptionDetailedReport:
      type: object
      required:
      - resultCode
      - resultDescription
      - transactionId
      - data
      properties:
        resultCode:
          example: '0000'
          type: string
          description: Result code. Example- '0000'
        resultDescription:
          example: Success
          type: string
          description: Result message. Example- 'Successfully processed'
        transactionId:
          example: 6f0bece6-7df3-4da4-af02-5e7f16e5e6fc
          type: string
          description: Transaction id returned by the provider system.
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageConsumptionDetailedReport'
    Bucket:
      type: object
      description: An usage consumption report enables to know at a given point the balances and the consumption counters related to various buckets (SMS, Voice, Data for example).
      properties:
        id:
          type: string
          description: Unique identifier
        type:
          type: string
          description: Type of unique identifier.
        description:
          type: string
          description: Description of the entity
        name:
          type: string
          description: Name of the entity.
        remainingAmount:
          $ref: '#/components/schemas/Quantity'
          description: Remaining balance of the entity
        activationDate:
          type: string
          format: date
          description: Activation date of the entity
        expiryDate:
          type: string
          format: date
          description: Expiry date of the entity
        bundleDetails:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          description: Bundle(s) included in the bucket or option subscribed.
        offerDetails:
          type: array
          items:
