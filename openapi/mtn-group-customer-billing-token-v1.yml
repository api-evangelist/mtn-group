  /bill/transactionStatus:   
    get:
      tags:
        - Status
      summary: Query transaction status
      description: Query the transaction status for refunds, order and debit transactions.
      parameters:
        - name: targetSystem
          in: query
          required: true
          type: string
          enum: 
            - Pantheon
        - name: type
          in: query
          required: false
          type: string
        - name: transactionId
          in: query
          required: false
          type: string
        - name: contractingPartnerId
          in: query
          required: false
          type: string
        - name: originTransactionID
          in: query
          required: false
          type: string
        - name: paymentRef
          in: query
          required: false
          type: string
        - name: orderRef
          in: query
          required: false
          type: string
      responses:
        '200':
          description: 'Success'
          schema:
            $ref: "#/definitions/transStatResponse"
        '400':
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        '401':
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        '403':
          description: "Forbidden"
          schema:
