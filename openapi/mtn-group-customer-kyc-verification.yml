  identityStatusResponse:
    type: object
    properties:
      statusCode:
        type: string
        description: This is the MADAPI Canonical Error Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system errors are mapped to specific canonical error codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes',
        example: '0000'
        maxLength: 30
      statusMessage:
        type: string
        description: More details and corrective actions related to the error which can be shown to a client. Success for 200. Mapped from REASON from backend. mapped from staus from backend.
        enum: ['success, failed']
      supportMessage:
        type: string
        description: Internal message meant for consumers of the API to troubleshoot the error (could possible include the back-end system error code in the message if it would be useful)
      transactionId:
        type: string
        description: Unique Id sent with the request
      data:
        type: object
        properties:
          customerId:
            type: string
            description: 'Unique Customer ID used during enrollment'
            example: '8606165224086'
          customerStatus:
            type: string
            enum: [NotEnrolled, EnrolledValid, EnrolledInvalid, EnrolledError, EnrolledExpired]
            example: 'NotEnrolled'
          externalStatus:
            type: string
            enum: [DHAOffline, DHAOnline, DHAOnlineC2Pass, DHAOnlineC3Pass]
            example: 'DHAOnlineC3Pass'
          modality:
            type: string
            enum: [face, finger]
            example: 'face'
          enrollmentId: 
            type: string
            description: 'Unique ID of enrollment'
            example: '6527c968e681c3aef989ff0c'
          enrollmentTimestamp: 
            type: string
            description: 'Timestamp of the original enrollment'
            example: '2023-10-12T10:24:40.966Z'
          agentId: 
            type: string
            description: 'Agent ID provided during enrollment for audit purposes'
          channelId: 
            type: string
            description: 'Channel ID provided during enrollment for audit purposes'
          lastVerifiedId: 
            type: string
            description: 'Unique ID of last verification transaction for audit purposes'
          lastVerifiedtimestamp:
            type: string
            description: 'Timestamp of the most recent re-authentication'
          lastVerifiedagentId: 
            type: string
            description: 'Agent ID provided during verification for audit purposes'
          lastVerifiedchannelId: 
            type: string
            description: 'Channel ID provided during verification for audit purposes'

