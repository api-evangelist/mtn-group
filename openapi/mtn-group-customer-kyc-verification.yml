  /biometric-roc/customers/identityStatus:
    post:
      tags:
        - Customer KYC
      summary: 'Get Identity Status by Customer ID'
      description: 'POST to query identity enrollment status by Customer ID'
      parameters:
        - name: transactionId
          in: header
          description: Transaction Id for tracking purposes
          required: false
          type: string
        - name: body
          in: body
          required: true
