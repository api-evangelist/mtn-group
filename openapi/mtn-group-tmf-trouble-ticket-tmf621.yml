openapi: 3.0.1
info:
  title: TMF621 Trouble Ticket Management  Aggregator
  description: "TMF621 Trouble Ticket Management  Aggregator This service provides\
    \ endpoint to fetch the ticket details with ticket id, create ticket, fetch list\
    \ of tickets by customer id and update the existing tickets"
  license:
    name: MADAPI
    url: https://developers.mtn.com/
  version: V1
servers:
- url: http://localhost:8083
  description: Generated server url
paths:
  /troubleTicket:
    get:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation retrieves trouble ticket
      description: Retrieve list of trouble ticket. It return a  list that has the
        data filtered by provided parameters. It provide the pagination's as well
        to retrieve the data in pages with required sizes.
      operationId: listTickets
      parameters:
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: limit
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: offset
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: publicIdentifier
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TroubleTicketResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    post:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation Creates a trouble ticket
      description: "This operation Creates a trouble ticket with provided details.\
        \ It accepts the category, description. externalId, name, priority and other\
        \ fields as well. After creation this returns the details of ticket as well."
      operationId: createTicket
      parameters:
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: targetSystem
        in: header
        required: false
        schema:
          type: string
          default: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /troubleTicket/{id}:
    get:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation retrieves a trouble ticket
      description: Ticket details fetched by ticket ID. The provides the details of
        existing ticket with required checks. If not present then it will throw the
        required errors
      operationId: viewTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: fields
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
    patch:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation updates a trouble ticket
      description: "This operation updates the status of a Ticket entity. Through\
        \ this operation, an existing ticket can be update as per requirements. User\
        \ with correct set of permission can update the ticket."
      operationId: updateTicket
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: targetSystem
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
          default: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /incident/{id}:
    patch:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation updates a trouble ticket category
      description: "This operation updates the category of a trouble ticket. Through\
        \ this operation, an existing ticket category can be update as per requirements"
      operationId: updateIncidentCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: targetSystem
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
          default: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /troubleTicket/category:
    get:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation retrieves a trouble ticket category and sub category
      description: "This operation retrieves the category  of a trouble ticket. Through\
        \ this operation, a ticket category and sub-category can be retrieved."
      operationId: getTroubleTicketCategory
      parameters:
