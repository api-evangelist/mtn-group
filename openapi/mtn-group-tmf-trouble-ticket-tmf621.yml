          type: string
        '@schemaLocation':
          type: string
        '@referredType':
          type: string
        '@type':
          type: string
    CountryInformation:
      type: object
      properties:
        country:
          type: string
        province:
          type: string
        city:
          type: string
    CreateRequest:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        externalId:
          type: string
        name:
          type: string
        nodeId:
          type: string
        countryInformation:
          $ref: '#/components/schemas/CountryInformation'
        priority:
          type: string
        severity:
          type: string
        ticketType:
          type: string
        channel:
