        in: query
        required: false
        schema:
          type: string
          enum:
          - CHANGE_TASK
          - SC_TASK
          - INCIDENT
      - name: category
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: subCategory
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: categoryStatus
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: ticketType
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: targetSystem
        in: header
        required: false
        schema:
          type: string
          default: ""
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: lob
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: field
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /incident/category:
    get:
      tags:
      - trouble-ticket-aggregator-controller
      summary: This operation retrieves a trouble ticket category and sub category
      description: "This operation retrieves the category  of a trouble ticket. Through\
        \ this operation, a ticket category and sub-category can be retrieved."
      operationId: getIncidentCategory
      parameters:
      - name: categoryType
        in: query
        required: false
