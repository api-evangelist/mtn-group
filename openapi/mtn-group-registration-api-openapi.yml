openapi: 3.2.0
info:
  title: Mtn Group Registration API
  version: '1.0'
  description: 'Operations tagged Registration across 3 of this provider''s published API definitions: mtn-group-customer-billing-token-v1.yml, mtn-group-notification-production.yml, mtn-group-notification-v2.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.mtn.com/v1/customer
- url: https://api.mtn.com/v1
- url: https://api.mtn.com/v2
tags:
- name: Registration
paths:
  /bill/registerToken:
