  /callback/delete-all-subscriptions:
    post:
      tags:
      - Callback
      summary: Callback service that MTN API will POST to with the result of the DELETE all subscriptions
      description: The result of the asynchronous DELETE for all a customers subscriptions will be POSTed to the callback URL that the developer must host. If there were multiple subscriptions, each result will be posted individually as it completes.
      operationId: Callback service that MTN API will POST to with the result of the DELETE all subscriptions
      responses:
        200:
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Unsubscribe'
        required: true
      security:
      - ApiKeyAuth: []
      - OAuth2: []
    servers:
    - url: https://api.mtn.com/v2
components:
  schemas:
    StatusEnum:
      type: string
      title: statusEnum
      example: Unsubscribe successful
      enum:
      - Unsubscribe successful
      - Unsubscribe unsuccessful
    Unsubscribe:
      type: object
      title: unsubscribe
      required:
      - status
      - statusCode
      - description
      properties:
        subscriptionId:
          type: integer
          description: ID for the Subscription
        subscriptionProviderId:
          type: integer
          description: Identity of the subscription provider hosting the subscription
        statusCode:
          type: integer
          description: Status Code
        status:
          $ref: '#/components/schemas/StatusEnum'
        description:
          type: string
          description: Details of the result of the unsubscribe action
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.mtn.com/v1/oauth/access_token
          scopes: {}
    Bearer:
      type: http
      description: Bearer token received from OAuth2.0 authentication with the MADAPI
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
