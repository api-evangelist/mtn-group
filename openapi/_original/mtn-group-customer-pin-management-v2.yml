definitions:

  SecurityQuestionAnswers:
    type: array
    items:
      type:  object
      properties:
        SecurityQuestionAnswer:
          $ref: "#/definitions/securityquestionAnswer"


  securityquestionAnswer:
    type: object
    required:
      - name
    properties:
      securityQuestion:
        type: string
        example: string
        description: "user will enter security question"
      securityAnswer:
        type: string
        example: string
        description: "user will enter answer for security question"


  ValidatePinResponse:
    type: object
    required:
      - name
    properties:
      statusCode:
        type: string
        example: "0000"
        description: "Success API code. '0000' in case of success"
      statusMessage:
        type: string
        example: "String"
      transactionId:
        type: string
        example: "String"
      data:
        type: object
        $ref: "#/definitions/ValidatePinResponseData"
  ValidatePinResponseData:
    type: "object"
    title: "ValidatePinResponseData"
    properties:
      message:
        type: "string"
        example: "Subscriber secret authenticated successfully"
        description: "API Success Message. i.e. Subscriber secret authenticated successfully"
      forcePasswordChange:
        type: string
        example: "false"
        description: "true/false"
      securityQuestionAvailable:
        type: string
        example: "true"
      emailID:
        type: string
        example: "sharma.anuj@tecnotree.com"
      tncAccepted:
        type: array
        items:
          type: string
        example:
          - Version: "2.0"
            AcceptedDate: "2020-07-11T13:43:30.830Z"
      tncLastUpdtdate:
        type: string
        example: "2020-07-01T10:10:11.830Z"
      tncLastUpdtversion:
        type: string
        example: "2.0"
  ChangePinResponse:
    type: object
    required:
      - name
    properties:
      statusCode:
        type: string
        example: "0000"
        description: "Success API code. '0000' in case of success"
      statusMessage:
        type: string
        example: "String"
      transactionId:
        type: string
        example: "String"
      customerId:
        type: string
        example: "String"
      data:
        type: object
        $ref: "#/definitions/ChangePinResponseData"
  ChangePinResponseData:
    type: "object"
