  /{customerId}:
    post:
      tags:
      - Kyc
      summary: Endpoint for KYC with Consent.
      description: "Endpoint for KYC with Consent - This endpoint initiate Kyc With\
        \ ConsentRequest. This accept customer id, channel, callback url, expiry time\
        \ and company name"
      operationId: Kyc_post_initiateKycWithConsentRequest_customerId
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: countryCode
        in: header
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
      - name: isConsentPreApproved
        in: header
        required: false
        schema:
          type: string
      - name: isMaskedResponse
        in: header
        required: false
        schema:
          type: string
      - name: partnerCallbackUrl
        in: header
        required: true
        schema:
          type: string
      - name: lob
        in: query
        required: false
        schema:
          type: string
      - name: idType
        in: query
        required: false
        schema:
          type: string
      - name: fields
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              title: InitiateKycConsentRequest
              required:
              - chenosisCallbackUrl
              - companyName
              - message
              type: object
              properties:
                application:
                  type: string
                expireInMinutes:
                  type: string
                companyName:
                  type: string
                reqBody:
                  type: string
                channel:
                  type: string
                message:
                  type: string
