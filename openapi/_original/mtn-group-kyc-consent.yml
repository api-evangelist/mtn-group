openapi: 3.0.1
info:
  title: Customer Kyc Consent
  description: "The Customer KYC Consent API facilitates the consent from the customer\
    \ while capturing and retrieval of Customer Information. This aggregator service\
    \ provides comprehensive Know Your Customer (KYC) consent management capabilities,\
    \ enabling secure customer data capture, consent validation, and information retrieval\
    \ operations across various channels and use cases."
  license:
    name: MADAPI
    url: https://developers.mtn.com/
  version: "2.0"
servers:
- url: https://api.mtn.com/v1
  description: Production Server
security:
- OAuth2: []
tags:
- name: Callback
- name: Kyc
