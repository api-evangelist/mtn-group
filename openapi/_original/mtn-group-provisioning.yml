                  type: string
                  description: When "offerType" is set to "myMTN Offers", this value
                    can be one of the following; "All", "myMTN Data", "myMTN Voice"
                    or "myMTN Social".  When its set to "Recharge Rewards"  this value
                    does not have to be passed.  If this value is not passed for any
                    "offerType", its defaulted to "All".If "offerType" is set to "Summer
                    Surprise" than sub type can be "Monthly","Weekly","All" etc.Currently
                    it has been configured for "All" .The summer surprise depends
                    also on the sourceIdentifier as SOA invokes corresponding target
                    system to retreive the product details.
                notify:
                  type: string
                  description: This indicates if on succesful purchase of bundle do
                    we need to notify the target channel.
                offerId: 
                  type : string
                  description : This value will be the offer id given for the bundle in the getMTN offer response.
                offerSubCategory:
                  type: string
                  description: Currently this field is optional.  Its a field that
                    can in future be used to filter the offers that you get back.
                    In case of "Summer Surprise" the subType could be "CVM","Wave"
                    and "Others", Currently target channel has catered for "CVM" and
                    "Wave" This field is only mandatory if the offer type is "Summer
                    Surprise".
  PostVASResponseV2:
      allOf:
      - required:
        - statusCode
        - statusMessage
        - supportMessage
        - transactionId
        type: object
        properties:
          statusCode:
            type: integer
            description: Back end status code.
            format: int32
            example: 'oooo'
          statusMessage:
            type: string
            description: User friendly error message.
            example: 'success'
          supportMessage:
            type: string
            description: Description message for Support teams
            example: 'success'
          transactionId:
            type: string
            description: Unique identifier for the transaction.
            example: '3456tret7ytr657'
  createVASRequestV5:
      allOf:
      - required:
        - cycles
        - description
        - frequency
        - msisdn
        - notify
        - offerId
        - provisionMedium
        - price
        - priceUOM
        - services
        - soId
        - sourceIdentifier
        - transactionId
        - validity
        type: object
        properties:
          transactionId:
            type: string
            description: Unique identifier for the transaction.
          sourceIdentifier:
            type: string
            description: Identifier of the system sending the OTP.  Currently it can
              be set to one of the following values; "Siebel", "Eppix", "myMTN App",
              "Online Store".
          msisdn:
            type: string
            description: MSISDN in international format.  For example "27832227009"
          soId:
            type: string
            description: VAS Code that indentifies the VAS service on the back-ends.  This
              can be obtained from the GET "mtnOffer" V2 service - its the "soId"
              field.
          provisionMedium:
            type: string
            description: Tjis field will determine the medium of purchase that the customer opts to buy the bundles.
            enum : [CARD, AIRTIME]
          validity:
            type: string
            description: Validity of an offer. For example "24 Days", “7 Weeks” or
              “1 Day”.
          frequency:
            type: string
            description: This field determines if the offer is recurring or not. This
              can also be useful to set the flag for recurring. This will be returned
              from 'offer recurrence' of get mtn offerS. Sample values could be 'Adhoc'
              or 'recurring'
          reprovisionCharge : 
            type : string
            description : For Recurring bundles PRICE will specify the initial purchase charge and reprovisionCaharge will specify the re-provision charge. If not specified, reprovisionCaharge will assume the value specified for PRICE. The value will be in cents
          cycles:
            type: string
            description: This field determines the number of cycles that the offer
              will be recurring
          subscriberType:
            type: string
            description: Currently this field is optional. It is used to determine
              if the subscriber is prepaid, postpaid, Coverged, hybrid etc. The channels
              will be sending the value if they have the context of the subscriber's
              msisdn if it is prepaid or postpaid.The values are 'P' for prepaid ,'C'
              for postpaid, 'H' for hybrid, 'V' for converged
          cyclesUOM:
            type: string
            description: This field indicates the unit of measure of the cycles that
              is returned for the offers. Sample values could be 'Days', 'Months'.
              The value is returned from the cycles unit of mesaure from the get offers
              call to Neon
          description:
            type: string
            description: Description of the bundle like 1GB-MTN-NightPlan.  This is
              obtaianed from the GET "mtnOffer" V2 service, its the "offerShortDescription"
              field.
          offerId:
            type: string
            description: This is the unique bundle id which can be obtained from the
              GET "mtnOffer" V2 service - its the "offerId" field
          price:
            type: string
            description: Price of the bundle which can be obtained from the GET "mtnOffer"
              V2 service - its the "offerPrice" field
          priceUOM:
            type: string
            description: This is currently always set as "R", as the GET "mtnOffer"
              service doesn't returne the price UOM.
          services:
            type: array
            description: List of services used to provision the variable VAS service.
            items:
              type: object
              properties:
                serviceValue:
                  type: integer
                  description: This is the service value of the offer.  This is the
                    "serviceValue" parameter obtained from the GET "mtnoffer" v2 service.
                serviceValidity:
                  type: string
                  description: The validity of the service returned from GET "mtnoffer".Returned
                    from VALIDITY field under services
                effectiveRate:
                  type: string
                  description: The effective rate of the bundle , the price in amount
                    like R200.  This is the "effectiveRate" parameter obtained from
                    the GET "mtnoffer" v2 service.
                serviceSubType:
                  type: string
                  description: Can be 'MIN' or 'DATA' or 'SMS'.  This is the "offerSubType"
                    parameter obtained from the GET "mtnoffer" v2 service.
                serviceUom:
                  type: string
                  description: Can be 'GB' or 'MB' for data, and 'Minutes' for minute
                    values.  This is the "serviceUOM" parameter obtained from the
                    GET "mtnoffer" v3 service.
                validityUom:
                  type: string
                  description: The validity of the services that us returned from
                    "mtnoffer". Values can be "Days", "Weeks", "Hours".
                promotion:
                  type: string
                  description: This field defines if the service returned from "mtnoffer".
                    The values can be 'T' or 'F'
          notify:
            type: array
            description: List of attributes to be passed for notification.
            items:
              type: object
              properties:
                notifyChannel:
                  type: string
                  description: 'This indicates if on succesful purchase of bundle
                    which channel has to notify. '
                offerType:
                  type: string
                  description: This is the type of "offer" being requested by the
                    service.  Currently it can be set to one of the following; "myMTN
                    Offers","Summer Surprise" or "Recharge Rewards".
                offerCategory:
                  type: string
                  description: When "offerType" is set to "myMTN Offers", this value
                    can be one of the following; "All", "myMTN Data", "myMTN Voice"
                    or "myMTN Social".  When its set to "Recharge Rewards"  this value
                    does not have to be passed.  If this value is not passed for any
                    "offerType", its defaulted to "All".If "offerType" is set to "Summer
                    Surprise" than sub type can be "Monthly","Weekly","All" etc.Currently
                    it has been configured for "All" .The summer surprise depends
                    also on the sourceIdentifier as SOA invokes corresponding target
                    system to retreive the product details.
                notify:
                  type: string
                  description: This indicates if on succesful purchase of bundle do
                    we need to notify the target channel.
                offerSubCategory:
                  type: string
                  description: Currently this field is optional.  Its a field that
                    can in future be used to filter the offers that you get back.
                    In case of "Summer Surprise" the subType could be "CVM","Wave"
                    and "Others", Currently target channel has catered for "CVM" and
                    "Wave" This field is only mandatory if the offer type is "Summer
                    Surprise".    
          
  
          

            

  Any: {}

  Error:
    type: "object"
    required:
      - statusCode
      - statusMessage
      - supportMessage
      - transactionId
    properties:
      timestamp:
        type: "string"
        format: "date-time"
        description: "Timestamp when the error occured."
        example: "2018-05-01T00:00"
      statusCode:
        type: string
        description: This is the MADAPI Canonical Error Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system errors are mapped to specific canonical error codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'
      statusMessage:
        type: string
        description: More details and corrective actions related to the error which can be shown to a client
      supportMessage:
        type: string
        description: Internal message meant for consumers of the API to troubleshoot the error (could possible include the back-end system error code in the message if it would be useful)
      transactionId:
        type: string
        description: This is the same transactionId that is sent in the request
     
