---
swagger: "2.0"
info:
  description: |-
    The Data Share API facilitates data share between Data Share Agent(Data Sender) and Customer(Data Receiver) also provides a data analytics.
    It also provides functionality to manage provider and consumer msisdns that are linked as part of the Internet Share Bundles Product

    **26-August-21: ChangeID: 0000000327**
      - Added a new GET endpoint /customers/{customerId}/summary
    **20-Sept-21: ChangeID: 0000000000**
      - Added a new GET endpoint /providers/{providerMsisdn}/eligibility
    **04-Oct-21: ChangeID: 0000000000**
      - Modified the POST endpoint to support Addition of a Consumer to a Family Pack Shared Account
    **18-Oct-21: ChangeID: 0000000000**
      - Modified the DELETE endpoint to support delete of all connsumers, delete a specific consumer from a shared family pack
    **20-Nov-21: ChangeID: 0000000000**
      - Added a new PATCH endpoint to enable setting of consumer data limits on a shared data package
  version: "1.7.1"
  title: Customer Data Share API
host: api.mtn.com
basePath: "/v1/datashare"
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  ApiKeyAuth:
    type: "apiKey"
    name: "X-API-Key"
    in: "header"
security:
  - ApiKeyAuth: []

paths:

  /providers/{providerMsisdn}:
    post:
      tags:
        - Provider
      summary: Add consumer msidsn to share data
      description: Allows a provider to add a customer to use their internet share bundle
      parameters:
        - name: "providerMsisdn"
          in: path
          description: Provider Msisdn.The format must be E.123
          required: true
          type: string
        - name: transactionId
          type: string
          description: This is the  transaction Id from the caller.
          in: header
        - in: body
          name: providerbody
          description: Request body
          required: true
          schema:
            $ref: '#/definitions/ConsumerInformation'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/ProviderShareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
    delete:
      tags:
        - Provider
      summary: Deactivates Internet sharing for a provider/consumer msisdn or removes consumer msisdns from the provider msisdn
      description: Allows a provider to leave data sharing or to remove a customer and hence stop them from using their internet share bundle
      parameters:
        - name: "providerMsisdn"
          in: path
          description: Provider Msisdn. This is the msisdn that has the active Internet Share Bundle. The format must be E.123
          required: true
          type: string

        - name: consumerMsisdn
          in: query
          description: The msisdn that is to be stopped from using the Internet Share bundle on the provider msisdn. The format must be E.123. Use this if you'd like to remove only one consumer from sharing the provider internet share bundle
          required: false
          type: string

        - name: removeConsumers
          in: query
          description: set this variable to the keyword ALL if you would like to remove all consumers sharing the provider internet share bundle
          required: false
          type: string
          enum:
            - ALL
        - name: transactionId
          type: string
          description: This is the  transaction Id from the caller.
          in: header
        - name: nodeId
          type: string
          description: This is the partner's identifier. For CIS this will be the iname
          in: query
        - name: input
          type: string
          description: This is additional input from the 3pp. For CIS, this is the product code
          in: query
        - name: targetSystem
          type: string
          in: query
          enum: [CIS]

      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
    patch:
      tags:
        - Provider
      summary: Update datashare limits and Suspend/Unsuspend number
      description: Allows a provider to adjust consumer limits
      parameters:
        - name: "providerMsisdn"
          in: path
          description: Provider Msisdn.The format must be E.123
          required: true
          type: string
        - name: transactionId
          type: string
          description: This is the  transaction Id from the caller.
          in: header
        - in: body
          name: providerbody
          description: Request body
          required: true
          schema:
            $ref: '#/definitions/ConsumerInformation'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/ProviderShareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
            
  /providers/{providerMsisdn}/activate:
    post:
      tags:
        - Provider
      summary: Activate data sharing plan
      description: Allows a provider to activate data sharing bundle
      parameters:
        - name: "providerMsisdn"
          in: path
          description: Provider Msisdn.The format must be E.123
          required: true
          type: string
        - name: transactionId
          type: string
          description: This is the  transaction Id from the caller.
          in: header
        - in: body
          name: providerbody
          description: Request body
          required: true
          schema:
            $ref: '#/definitions/ConsumerInformation'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/ProviderShareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'

    get:
      tags:
        - Provider
      summary: Retrieve all consumer MSISDNs linked to the provider msisdn
      description: Provides the ability to retrieve all consumers that are sharing the internet share bundle with the provider
      parameters:
        - name: "providerMsisdn"
          in: path
          description: Provider Msisdn. The format must be E.123
          required: true
          type: string
        - in: query
          name: clientTransactionId
          type: string
          description: 3pp transaction Id
        - name: partnerId
          in: query
          type: string
          description: This is the iname value of the partner
        - name: action
          in: query
          type: string
          description: This is the expected backend action. VIEW_FAMILY_PACK_CONSUMERS when viewing consumers and VIEW_FAMILY_PACK_PROVIDER when viewing providers
          enum: [VIEW_FAMILY_PACK_CONSUMERS, VIEW_FAMILY_PACK_PROVIDER]
        - name: viewType
          in: query
          type: string
          enum: [PROVIDER, CONSUMER]
        - in: query
          name: productId
          type: string

      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/ConsumersListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'

  /providers/{providerMsisdn}/eligibility:
    get:
      tags:
        - Provider
      summary: Check if a number is a provider
      description: Allows a 3pp to check if a number is a provider or not
      parameters:
        - name: "providerMsisdn"
          in: path
          description: Provider Msisdn.The format must be E.123
          required: true
          type: string
        - in: query
          name: clientTransactionId
          type: string
          description: 3pp transaction Id
        - name: partnerId
          in: query
          type: string
          description: This is the iname value of the partner
        - name: action
          in: query
          type: string
          enum: [IS_PROVIDER]
        - in: query
          name: productId
          type: string


      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/ProviderEligibilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'

