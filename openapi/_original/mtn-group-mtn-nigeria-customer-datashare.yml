          required: true
          type: string
        - name: productcode
          type: string
          in: query
          required: true
          description: The product code e.g NACT_NG_others_1
        - in: body
          name: body
          description: Request body
          required: true
          schema:
            $ref: '#/definitions/ReceiverInformation'
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/DataShareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'


    get:
      deprecated: true
      tags:
        - Customer
      summary: Retrieve Receivers' MSISDN
      description: Provides the ability to retrieve all registered receiver's msisdn.
      parameters:
        - name: "senderMsisdn"
          in: path
          description: Source Msisdn. The format must be E.123
          required: true
          type: string

      responses:
        "200":
