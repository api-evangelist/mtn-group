  /customers/{customerId}/analytics:
    get:
      tags:
        - Customer
      summary: Get analytic information of your data usage
      description: Get analytic information of your data usage and list of beneficiaries enjoying from the data.
      parameters:
        - name: "customerId"
          in: path
          description: Customer Msisdn. E.123 e.g 2349062058464
          required: true
          type: string
        - name: "type"
          required: true
          type: string
          in: "query"
          enum:
            - provider
            - beneficiary
          description: "Select the type of query to get"
        - name: "startDate"
          in: query
          type: string
          description: "Filter the response data by start date"
          required: true
          x-example: 20201001
        - name: "endDate"
          in: query
          type: string
          description: "Filter the response data by end date"
          required: true
          x-example: 20201004
        - name: "pageNum"
          in: query
          type: string
          description: "Filter the response data by page number"
          required: false
          x-example: 1
        - name: "pageSize"
          in: query
          type: string
          description: "Filter the response data by page size"
          required: false
          x-example: 5
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              statusCode:
                type: string
                description: "This is the MADAPI Canonical response Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system response are mapped to specific canonical response codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'"
              statusMessage:
                type: string
                description: "Status Message"
              transactionId:
                type: string
                description: "API generated Id to include for tracing requests"
              data:
                type: array
                items:
                  $ref: "#/definitions/DataUsagerInformation"
              _links:
                type: object
                properties:
                  self:
                    type: string
                    example: "https://api.mtn.com/v1/customers/23464618463/analytics"
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'

  /customers/{customerId}/summary:
    get:
      tags:
        - Customer
      summary: Get GDS summary your data usage
      description: Get group data share summary for your dta usage.
      parameters:
        - name: "customerId"
          in: path
          description: Customer Msisdn. E.123 e.g 2349062058464
          required: true
          type: string
        - name: "type"
          required: true
          type: string
          in: "query"
          enum:
            - provider
            - beneficiary
            - consumer
          description: "Select the type of query to get"
        - name: "startDate"
          in: query
          type: string
          description: "Filter the response data by start date"
          required: true
          x-example: 20201001
        - name: "endDate"
          in: query
          type: string
          description: "Filter the response data by end date"
          required: true
          x-example: 20201004
        - name: "pageNum"
          in: query
          type: string
          description: "Filter the response data by page number"
          required: false
          x-example: 1
        - name: "pageSize"
          in: query
          type: string
          description: "Filter the response data by page size"
          required: false
          x-example: 5
        - name: "summaryPeriod"
          in: query
          type: string
          description: "Shall be mandatory for provider and beneficiary type"
          required: false
          enum:
            - Daily
            - Weekly
            - Monthly

      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              statusCode:
                type: string
                description: "This is the MADAPI Canonical response Code (it is 4 characters long and it is not the HTTP Status Code which is 3 characters long). Back-end system response are mapped to specific canonical response codes which are returned. More information on these mappings can be found on the MADAPI Confluence Page 'Response Codes'"
              statusMessage:
                type: string
                description: "Status Message"
              transactionId:
                type: string
                description: "API generated Id to include for tracing requests"
              customerId:
                type: string
                description: "Customer Id"
              data:
                type: object
                properties:
                  pageNumber:
                    type: number
                    description: Current Page Number
                    example: 1
                  recordsCount:
                    type: number
                    description: This is the number of records returned from the summary
                    example: 25
                  maximumRecords:
                    type: number
                    description: This is the maximum number of records that can be returned
                  summaryDetails:
                    type: array
                    items:
                      $ref: "#/definitions/DataSummaryInformation"
              _links:
                type: object
                properties:
                  self:
                    type: string
                    example: "https://api.mtn.com/v1/customers/23464618463/analytics"
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'



definitions:
  DataSummaryInformation:
    type: object
    description: Sumary information for the subscriber
    properties:
      id:
        type: string
        description: "Mobile number wose summary is being returned"
      summaryType:
        type: string
        description: Summary Type
      dataUsage:
        type: object
        properties:
          value:
            type: number
            description: Data value
          unit:
            type: string
            description: data unit forexample KB
      date:
        type: string
      week:
        type: string
      month:
        type: string
      yearMonth :
        type: string
  DataUsagerInformation:
    type: object
    description: "The impacted system success response"
    properties:
      serviceDurationUnit:
        type: string
        example: "B"
      servedmsisdn:
        type: string
        example: "9062292938"
        description: "Customer Msisdn."
      providerMsisdn:
        type: string
        example: "9062756289"
        description: "Data Provider Msisdn"
      serviceDuration:
        type: integer
        example: 130528
      serviceClassId:
        type: string
        example: "300"
      serviceType:
        type: string
        example: "GPRS"
      currencyCode:
        type: string
        example: "NGN"
      dateKey:
        type: integer
        example: 20201001
      apn:
        type: string
        example: "web.gprs.mtnnigeria.net"


  SuccessResponse:
    type: object
    properties:
      statusCode:
        type: string
        description: HTTP Error code extension
        example: "0000"
      errorCode:
        type: string
        description: HTTP Error code extension
        example: "S1001"
      statusMessage:
        type: string
        example: "Action Successful"
      transactionId:
        type: string
        description: Transaction Id used for tracking purposes
        example: "txn123"
      data:
        type: object
        properties:
          countryCode:
            type: string
            description: ISO Country Code
            example: NG
          action:
            type: string
          product:
            type: object
            properties:
              productId:
                type: string
                description: Product Id
              productName:
                type: string
                description: Product name
              productType:
                type: string
                description: Product type
          amountCharged:
            type: number
            format: float
            description: Amount charged during the delete operation
          notification:
            type: string
      _link:
        type: object
        properties:
          self:
