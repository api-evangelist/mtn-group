  /customers/registration:
    post:
      tags:
      - SimManagementService
      summary: provide the functionality of starter pack registration
      description: "This operation facilitates the registration of new starter packs\
        \ for customers, ensuring that all necessary details are captured and processed\
        \ securely and efficiently for service activation."
      operationId: SimManagementService_post_registration_customersregistratio
      parameters:
      - name: registrationType
        in: query
        required: true
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              title: CustomerRegistrationRequest
              type: object
              properties:
                customerInformation:
                  type: array
                  items:
                    title: CustomerInformation
                    type: object
                    properties:
                      customerType:
                        type: string
                      engagedParty:
                        title: EngagedParty
                        type: object
                        properties:
                          contactMedium:
                            type: array
                            items:
                              title: ContactMedium
                              type: object
                              properties:
                                type:
                                  type: string
                                value:
                                  type: string
                          givenName:
                            type: string
                          middleName:
                            type: string
                          familyName:
                            type: string
                          individualIdentification:
                            type: array
                            items:
                              title: IndividualIdentification
                              type: object
                              properties:
                                placeOfIssue:
                                  type: string
                                issuingDate:
                                  type: string
                                expiryDate:
                                  type: string
                                visaExpiryDate:
                                  type: string
                                documentPurpose:
                                  type: string
                                type:
                                  type: string
                                identificationId:
                                  type: string
                          birthdate:
                            type: string
                          nationality:
                            type: string
                productOfferings:
                  type: array
                  items:
                    title: ProductOffering
                    type: object
                    properties:
                      characteristics:
                        type: array
                        items:
                          title: Characteristic
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            value:
                              type: string
                            type:
                              type: string
                      customFields:
                        title: CustomFields
                        type: object
                        properties:
                          registrationType:
                            type: string
        required: true
      responses:
        "200":
          description: Success
        "400":
          description: "Bad request. Invalid request parameters, missing required\
