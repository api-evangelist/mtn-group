  /customers/{customerId}/simSwap:
    put:
      tags:
      - SimManagementService
      summary: Initiate the SIM swap process
      description: "This operation initiates the SIM swap procedure for a customer,\
        \ allowing them to transfer their existing mobile number to a new SIM card\
        \ while maintaining their service."
      operationId: SimManagementService_put_initiateSimSwap_customerscustomerIds
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: targetSystem
        in: header
        required: false
        schema:
          type: string
      - name: transactionId
        in: header
        required: false
        schema:
          type: string
      - name: x-country-code
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              title: InitiateSimSwapRequestDto
              type: object
              properties:
                nodeId:
                  type: string
                idNumber:
                  type: string
                dateOfBirth:
                  type: string
                relatedParty:
                  title: RelatedParty
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    role:
                      type: string
                    geographicLocation:
                      title: GeographicLocation
                      type: object
                      properties:
                        spatialRef:
                          type: string
                        geometry:
                          title: Geometry
                          type: object
                          properties:
                            x:
                              type: string
                            "y":
                              type: string
                            z:
                              type: string
                    '@referredType':
                      type: string
                oldSimNumber:
                  type: string
                newMSISDN:
                  type: string
                newSimNumber:
                  type: string
                reasonCode:
                  type: string
                effectiveFrom:
                  type: string
                lastRechargeDate:
                  type: string
                  format: date-time
                lastRechargeAmount:
                  type: number
                  format: double
                simActivationDate:
                  type: string
                  format: date-time
                frequentlyDialedNumber:
                  type: string
                timestamp:
                  type: string
                mostRecentDeviceName:
                  type: string
                authenticationMethod:
                  type: string
        required: true
      responses:
