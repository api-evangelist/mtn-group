                - price
                - vat
                - digitalServiceInfo
              properties:
                skuId:
                  type: string
                  description: Unique ID of the saleble item from ATG catalog.
                displayName:
                  type: string
                  description: The disnplay name of the subscription.
                price:
                  type: number
                  description: The price of the subscription inclusive of VAT.
                  format: double
                vat:
                  type: number
                  description: The vat on the subscription.
                  format: double
                digitalServiceInfo:
                  type: object
                  required:
                    - svcId
                  properties:
                    svcId:
                      type: string
                      description: The unique ID of the DEP service
                    displayName:
                      type: string
                      description: The customer-friendly name as it will be used in various communications to the customer by the DEP during the on-boarding and cancellation process. .
                    partnerDisplayName:
                        type: string
                        description: The name of the provider of the service/content to the end user. This can be the name of your organisation or the name of a third-party organisation on whose behalf you are acting with respect to the service being configured. (If this field is provided DEP will use this in all messaging templates that require variable replacement for partner name, otherwise the Partner Company Name (short name) will be used)
                    partnerImage:
                      type: string
                      description: The URL of the service/conent image from CMS.
                    billingRate:
                        type: string
                        description: The gross price billed to the end user’s account for use of the service.
                    initialCharge:
                        type: string
                        description: This is a charge over and above the price of the service that will be billed on subscription activation. It can be used for example in conjunction with free days to charge a reduced fee for the first month. For example for a R30 Monthly service the first 30 days can be configured as free and the Initial Charge set as R15 thus giving away the 1st month at 50% discount. Note there is no micro billing or retry on this charge. If it fails then the subscription will remain in GRACE
                    billingType:
                        type: string
                        description: There are two options - Micro and Full. They define how a subscription to this service will be billed. Micro, will attempt to bill any amount at or below the billing cycle. It will keep attempting micro charges during the billing frequency until it has acquired the full Billing Rate. Full, will only attempt the full Billing Rate and will keep attempting during the billing cycle until it gets s success. Both options support back billing. Please note changing this on a service will ONLY impact new subscriptions for that service.
                    freeTrialDays:
                        type: string
                        description: The number of days offered as a free trial before recurring billing commences (where applicable). Please note changing this on a service will ONLY impact new subscriptions for that service.
                    deliveryChannel:
                        type: string
                        description: The channel through which the service is delivered to the end user (SMS or WEB)
                    contentType:
                        type: string
                        description: The content type ID that best represents the nature of the content provided by the service being configured as per the table in
                    contentCategory:
                        type: string
                        description: The main category for your product or content. If you have any questions about what category to use then please confirm with your MTN account manager.
                    contentSubCategory:
                        type: string
                        description: The related sub category for your product or content. If you have any questions about what sub category to use then please confirm with your MTN account manager.
                    billingFrequency:
                        type: string
                        description: The frequency at which users should be billed for the service. Possible values are Onceoff / AdhocDaily recurring, Weekly recurring, Monthly recurring
                    revenueTreatment:
                        type: string
                        description: This relates to your MTN contract and who is reslonsible for VAT. By default it will be set to “Agent” but please confirm with your MTN account manager if it should be set to “Principle” for your service.
                    graceDays:
                        type: string
                        description: The amount of time the user will be given “grace” access to the product/service if their subscription renewal bill should fail. Back billing will be used to recover any free grace period access the user received and as such if no grace days are configured on a service then no back billing will take place. Please note changing this on a service will ONLY impact new subscriptions for that service.
                    delayStop:
                        type: string
                        description: When a user stops their subscription the stop is delayed until the end of the current paid up billing cycle or free trial. If the current billing cycle has not yet been billed  successfully then the subscription will be stopped immediately. For non-user initiated cancellations, such as MNO porting, TCF churn etc, the subscription will be stopped immediately.  Please note changing this on a service will impact ALL existing subscriptions for that service.
                    notificationURLs:
                        type: string
                        description: A URL the DEP will use to post notifications of subscription and billing events to your application. Note Must be HTTPS and you MUST have implemented the Billing and/or Subscription Notification API as described below.
                    doiReturnURL:
                        type: string
                        description: A URL an end user should be redirected to following a WAP subscription activation.
                    supportNumber:
                        type: string
                        description: Service customer care number used in messaging templates. Optional. Used if you want to override the value configured at partner level, else leave blank to use partner value.
                    termsAndConditionsURL:
                        type: string
                        description: URL to the service terms and conditions web page. Optional. Used if you want to override the value configured at partner level, else leave blank to use partner value.
                    doiTemplates:
                        type: string
                        description: Please refer to the "Banner Styleguide & DEP Template Management.pdf" document in the DEP Welcome Pack.
