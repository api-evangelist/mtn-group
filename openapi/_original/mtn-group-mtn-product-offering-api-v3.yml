                              "serviceValue" parameter obtained from the GET "mtnoffer" v7 service.
                          serviceValidity:
                            type: string
                            description: The validity of the service returned from GET "mtnoffer" v7 service.Returned from VALIDITY field under services
                          effectiveRate:
                            type: string
                            description: The effective rate of the bundle , the price in amount
                              like R200.  This is the "effectiveRate" parameter obtained from
