swagger: '2.0'

# This is your document metadata
info:
  version: "3.0.9"
  title: MTN Product API
  description: |
    A MTN API that controls the display of the catalog of Products available for a customer to purchase.
host: api.mtn.com
basePath: "/v3"
schemes:
  - https
consumes:
  - application/json;charset=utf-8
produces:
  - application/json;charset=utf-8

security:
  - ApiKeyAuth: []
  - OAuth2: []
  
securityDefinitions:
  ApiKeyAuth:
    type: "apiKey"
    name: "X-API-Key"
    in: "header"
  OAuth2:
    type: oauth2
    flow: application
    tokenUrl: https://api.mtn.com/v1/oauth/access_token


# Describe your paths here
paths:

  # This is a path endpoint. Change it.
  /products:
    get:
      description: "Retrieves the Catalog of Products available to a 3PP identified by the nodeId."
      summary: "View product Catalog"
      tags:
        - "products"
      parameters:
        - name: "nodeId"
          in: "query"
          description: "3rd party assigned unique id"
          required: true
          type: "string"
        - name: productProviderId
          in: query
          type: string
          description: This is the id of the service provider
          required: false
        - name: "credentials"
          in: "header"
          description: "Base64 encoding of 3rd party username and password"
          required: false
          type: "string"
        - name: "category"
          in: "query"
          type: "string"
          description: "Category of the product to be fetched from that catalogue"
        - name: "subCategory"
          in: "query"
          type: "string"
          description: "This can be any of the sub category of the category entered. This may be require only if the category is passed."
        - name: "requestType"
          in: "query"
          type: "string"
          description: "This determines the type of request being send. In callertunes, it holds the SOAP Action"
        - name: "autoRenewal"
          in: "query"
          type: "string"
          description: "Specify if the product should be auto renewal or not"
          enum: [YES,NO]
        - name: "serviceClass"
          in: "query"
          type: "string"
          description: "Specify the class of service"
        - name: "offerName"
          in: "query"
          type: "string"
          description: "Specify the offer name to be searched"
      responses:
        200:
          description: "Product Catalog object. For a successful request, the response will contain all the products available. If a product type does not have any requested data, then those fields will be null. E.g. if the product type (e.g. Data) does not have products, then the data field will be an empty list."
          schema:
            $ref: "#/definitions/ProductCatalogue"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        403:
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Customer not found"
          schema:
            $ref: "#/definitions/Error"
        405:
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"



  # This is a path endpoint. Change it.
  /products/{customerId}:
    get:
      description: "Retrieves the Catalog of Products available to a customer identified by customerId, out of the catalog of products available to a 3PP identified by nodeId."
      summary: "View product Catalog."
      tags:
        - "products"
      parameters:
        - name: "customerId"
          in: "path"
          description: "ID of the customer. It could be MSISDN, email address, or any other customer identifier"
          required: true
          type: "string"
        - name: "nodeId"
          in: "query"
          description: "3rd party assigned unique id"
          required: false
          type: "string"
        - name: "credentials"
          in: "header"
          description: "Base64 encoding of 3rd party username and password"
          required: false
          type: "string"
        - name: "offerType"
          in: "query"
          required: false
          type: "string"
          enum: [AIRTIME,VOICE,DATA,SMS,ALL,NDAKO]
        - name: filterByMABand
          in: query
          type: boolean
          required: false
          description: When TRUE, The API shall return only the products that falls within the MSISDN main account balance band.
        - name: "category"
          in: "query"
          type: "string"
          description: "Category of the product to be fetched from that catalogue"
        - name: "subCategory"
          in: "query"
          type: "string"
          description: "This can be any of the sub category of the category entered. This may be require only if the category is passed."
        - name: "productRef"
          in: "query"
          required: false
          type: "string"
          description:  "This is an external reference number or product code which most have been generated by the provider or consumer"
        - name: "channel"
          in: "query"
          required: false
          type: "string"
          enum: [USSD,Momo,MTNApp,MTNWeb,SMS,MOD]
        - name: "productProviderId"
          in: "query"
          required: false
          type: "string"
          enum: [LUMOS,CIS]
          description:  This is the identifier for the backend system expected to fullfil the request
        - in: "query"
          name: "pref language"
          required: false
          description: The language in which the response is required
          type: "string"
          enum: [En,Fr]
        - name: offerQuantity
          type: number
          description: For Bulk SMS product, this is the number of SMS to get a price quote for.
          in: query
        - name: "autoRenewal"
          in: "query"
          type: "string"
          description: "Specify if the product should be auto renewal or not"
          enum: [YES,NO]
        - name: "serviceClass"
          in: "query"
          type: "string"
          description: "Specify the class of service"
        - name: "offerName"
          in: "query"
          type: "string"
          description: "Specify the offer name to be searched"
      responses:
        200:
          description: "Product Catalog object. For a successful request, the response will contain all the products available. If a product type does not have any requested data, then those fields will be null. E.g. if the product type (e.g. Data) does not have products, then the data field will be an empty list."
          schema:
            $ref: "#/definitions/ProductCatalogue"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        403:
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Customer not found"
          schema:
            $ref: "#/definitions/Error"
        405:
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"

  /products/{customerId}/{productId}:
    get:
      description: "Retrieve the details of a given product, most especially it's price. If nodeId is passed to this request, the returned price will be the price of the product as listed with the 3PP identified by nodeId."
      summary: "Retrieve the details of a given product - Query bundle price"
      tags:
        - "products"
      parameters:
        - name: "customerId"
          in: "path"
          description: "ID of the customer. It could be MSISDN, email address, or any other customer identifier"
          required: true
          type: "string"
        - name: "productId"
          in: "path"
          description: "ID of the product"
          required: true
          type: "string"
        - in: query
          name: "promotionCode"
          type: string
          required: false
          description: "Promotion code assigned to product"
        - in: query
          name: "transactionId"
          type: string
          required: false
          description: "Transaction ID"
        - name: "credentials"
          in: "header"
          description: "Base64 encoding of 3rd party username and password"
          required: false
          type: "string"
      responses:
        200:
          description: "Product Details. For a successful request, the response will contain all the details of the product."
          schema:
            $ref: "#/definitions/ProductBundlePrice"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        403:
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found"
          schema:
            $ref: "#/definitions/Error"
        405:
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"


  /products/{customerId}/eligibility/{productId}:
    get:
      description: "Check customer eligibility for product"
      summary: "Check the eligibility of a customer to buy a product"
      tags:
        - "products"
      parameters:
        - name: "customerId"
          in: "path"
          description: "ID of the customer. It could be MSISDN, email address, or any other customer identifier"
          required: true
          type: "string"
        - name: "productId"
          in: "path"
          description: "ID of the product"
          required: true
          type: "string"
        - name: "credentials"
          in: "header"
          description: "Base64 encoding of 3rd party username and password"
          required: false
          type: "string"
        - name: "nodeId"
          in: "query"
          description: "3rd party assigned unique id. iname of the 3PPs which can call these service and must be whitelisted first"
          type: "string"
        - name: "clientTransactionId"
          in: query
          type: string
          default: 234872789
          description: "Client generated Id to include for tracing requests"
        - name: "viewType"
          in: query
          type: string
          description: "The view requested"
          enum:
            - checkOffer
        - name: "targetSystem"
          in: query
          type: string
          description: "The target system"
          enum:
            - AirServer
            - CIS
            - CLM
            - MBAS
        - name: "registrationChannel"
          in: query
          type: string
          default: SMS
          description: "Channel making request"
        - name: "productType"
          in: query
          type: string
          description: "Type of product"
        - name: "productCategory"
          in: query
          type: string
          description: "Type of category"

      responses:
        200:
          description: "Details for a successful request."
          schema:
            $ref: "#/definitions/ProductEligibilityResponse"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        403:
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found"
          schema:
            $ref: "#/definitions/Error"
        405:
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"
  /products/{customerId}/blacklist/{productId}:
    post:
      description: "Blacklist customer for product/service"
      summary: "Blacklist the customer to consume a product"
      tags:
        - "products"
      parameters:
        - name: "customerId"
          in: "path"
          description: "ID of the customer. It could be MSISDN, email address, or any other customer identifier"
          required: true
          type: "string"
        - name: "productId"
          in: "path"
          description: "ID of the product"
          required: true
          type: "string"
        - name: transactionId
          in: header
          description: Client generated Id to include for tracing requests.
          type: string
          x-example: 6f0bece6-7df3-4da4-af02-5e7f16e5e6fc
          required: false
        - name: "targetSystem"
          in: query
          type: string
          description: "The target system"
          enum:
            - AirServer
            - CIS
            - CLM
            - MBAS
        - name: BlacklistRequest
          in: body
          description: Order details for the payment link that is to be created.
          required: true
          schema:
            $ref: '#/definitions/BlacklistRequest'
      responses:
        200:
          description: "Details for a successful request."
          schema:
            $ref: "#/definitions/ProductEligibilityResponse"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        403:
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found"
          schema:
            $ref: "#/definitions/Error"
        405:
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"
  /products/{customerId}/dormant:
    post:
      description: "Make a customer dormant for product/service"
      summary: "Make a customer dormant in relation to a to a product"
      tags:
        - "products"
      parameters:
        - name: "customerId"
          in: "path"
          description: "ID of the customer. It could be MSISDN, email address, or any other customer identifier"
          required: true
          type: "string"
        - name: transactionId
          in: header
          description: Client generated Id to include for tracing requests.
          type: string
          x-example: 6f0bece6-7df3-4da4-af02-5e7f16e5e6fc
          required: false
        - name: "targetSystem"
          in: query
          type: string
          description: "The target system"
          enum:
            - AirServer
            - CIS
            - CLM
            - MBAS
        - name: DormantRequest
          in: body
          description: Order details for the payment link that is to be created.
          required: true
          schema:
            $ref: '#/definitions/DormantRequest'
      responses:
        200:
          description: "Details for a successful request."
          schema:
            $ref: "#/definitions/ProductEligibilityResponse"
        400:
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        401:
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        403:
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found"
          schema:
            $ref: "#/definitions/Error"
        405:
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        500:
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"

  /products/{customerId}/category:
    get:
      operationId: getProductCategory
      summary: Get product Category
      description: View the list of products Category for a subscriber.
      tags:
        - products
      parameters:
        - name: "customerId"
          in: path
          description: Customer Msisdn. The format must be E.123 e.g 2349062058464
          required: true
          type: string
        - name: "targetSystem"
          in: header
          type: string
          description: "Target system"
          enum:
           - FLYTXT
        - name: "productType"
          in: "query"
          type: "string"
          required: true
          enum:
            - CVMoffer
          description: "Specify the type of product request. e.g CVMoffer(Customer Value Management) is a Flytxt product."
        - name: "nodeId"
          required: true
          type: string
          in: "query"
          description: "Third parties unique identifier. Can also be called channelId or iname"
        - name: transactionId
          in: header
          type: string
          description: Client generated Id to include for tracing requests, so that the API can easily trace the HTTP request all the way from a client to MTNs backend processes (via our proxies). Each time a request is made to an MTN API the client should include a unique request reference in the HTTP Header. The value must be between 5 and 20 characters, and consist of ASCII letters, digits, or the characters. Invalid or blank IDs will be ignored and replaced with generated ones. MTN may use this to detect duplicate transactions from the client, but this functionality is not always guaranteed, so clients must make their own efforts to prevent duplicate transactions. MTN will also log the transactionId in order to assist with debugging and to correlate transactions processed by the API to requests from the client.
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/OfferCategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'


  /products/{customerId}/eligible:
    get:
      operationId: getOffers
      summary: Get list of eligible Offers
      description: View the list of eligible products offers applicable for a subscriber.
      tags:
        - products
      parameters:
        - name: "customerId"
          in: path
          description: Customer Msisdn. The format must be E.123 e.g 2349062058464
          required: true
          type: string
        - name: "productType"
          in: "query"
          type: "string"
          required: true
          enum:
            - CVMoffer
            - Normal
            - Bundle
          description: "Specify the type of product request. e.g CVMoffer(Customer Value Management) is a Flytxt product."
        - name: "targetSystem"
          in: header
          type: string
          description: "Target system"
          enum:
           - FLYTXT
           - NEON_FLYTXT
        - name: credentials
          in: header
          type: string
          description: "Credentials to be passed by the 3PP"
          x-example: "aYxsiUusl878fsx"
        - name: "appCpid"
          in: query
          description: Id of the product to fetch.
          required: false
          type: string
        - name: "category"
          in: query
          description: Type of offer to fetch.
          required: false
          type: string
          enum:
            - Topdeal
            - Recharge
            - DataBundle
            - Combo
            - Voice
            - VAS
          x-example: "product"
        - name: "subCategory"
          in: query
          type: string
          required: false
          x-example: "MOMO"
        - name: "nodeId"
          required: false
          type: string
          in: "query"
          description: "Third parties unique identifier. Can also be called channelId or iname"
        - name: transactionId
          in: header
          type: string
          description: Client generated Id to include for tracing requests, so that the API can easily trace the HTTP request all the way from a client to MTNs backend processes (via our proxies). Each time a request is made to an MTN API the client should include a unique request reference in the HTTP Header. The value must be between 5 and 20 characters, and consist of ASCII letters, digits. Invalid or blank IDs will be ignored and replaced with generated ones. MTN may use this to detect duplicate transactions from the client, but this functionality is not always guaranteed, so clients must make their own efforts to prevent duplicate transactions. MTN will also log the transactionId in order to assist with debugging and to correlate transactions processed by the API to requests from the client.
        - name: limit
          in: query
          description: "The total number of offers to retrieve"
          x-example: 50
          type: string

      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/OfferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'


  /products/productOffering:
    get:
      operationId: listProductOffering
      summary: List or find ProductOffering objects
      description: This operation list or find ProductOffering entities
      tags:
        - products
      parameters:
        - name: "transactionId"
          in: header
          required: false
          description: 'Client generated Id to include for tracing requests.'
          type: string
          x-example: '6f0bece6-7df3-4da4-af02-5e7f16e5e6fc'
        - name: "senderId"
          in: query
          required: true
          type: string
          description: 'Provide the channel information'
          x-example: 'IVR'
        - name: topOffers
          description: If true is populated on this field, the service will return all the products where topOffers = true.
          required: false
          in: query
          type: boolean
          default: "false"
        - name: yelloTraderId
          description: Either one or multiple yelloTraderIds (deal code) separated with comma can be passed to fetch the offers associated. example - 2020710 CT 00350,2019711 CT 00351,2019713 CT 00352
          required: false
          in: query
          type: integer
        - name: limit
          description: Requested number of resources to be provided in response
          required: false
          in: query
          type: integer
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/Response_ProductOffering'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        '405':
          description: Method Not allowed
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
  /products/productOffering/roaming:
    get:
      operationId: listofRoamingproducts
      summary: List of roaming ProductOffering objects
      description: This operation list or find all the roaming bundles that are available for the country and subscriber type
      tags:
        - products
      parameters:
        - name: "transactionId"
          in: header
          required: false
          description: 'Client generated Id to include for tracing requests.'
          type: string
          x-example: '6f0bece6-7df3-4da4-af02-5e7f16e5e6fc'
        - name: "x-origin-channelId"
          in: header
          type: string
          description: 'Provide the channel information'
          x-example: 'IVR'
        - name: targetSystem
          in: header
          type: string
          description: 'Provide the target system information'
          x-example: 'XMF'
        - name: productName
          description : 'Provide the product name'
          in: query
          type: string
        - name: countryCode
          description: 'Provide the country code of the subscriber'
          in: query
          type: string
          x-example: 'CM'
        - name: subscriberType
          description: 'Provide the subscriber type'
          in: query
          type: string
          x-example: 'P'
          
          
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/roamingProductOffering'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Error400'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error401'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/Error404'

  /products/{id}/comvCatalogue:
    get:
      operationId: listProductCatalogue
      summary: List or find ProductCatalogue objects
      description: This operation list or find ProductCatalogue entities
      tags:
        - products
      parameters:
        - name: "id"
          in: path
          required: true
          type: string
          description: 'Provide the service information'
          x-example: 'IVR'
        - name: "transactionId"
          in: header
          required: false
          description: 'Client generated Id to include for tracing requests.'
          type: string
          x-example: '6f0bece6-7df3-4da4-af02-5e7f16e5e6fc'
        - name: "countryCode"
          in: "header"
          description: "Country code to include"
          required: false
          type: "string"
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/Response_ProductCatalogue'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        '405':
          description: Method Not allowed
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'
  /products/productConfiguration/{id}:
    get:
      tags:
        - products
      summary: productConfiguration 
      description: product Configuration of items
      operationId: configuration 
      parameters:
        - name: transactionId
          in: header
          description: Client generated Id to include for tracing requests
          type: string
          required: true
        - name: nodeId
          in: query
          description: Third parties unique identifier. Can also be called channelId
          type: string
          required: true
        - name: cookie
          in: header
          required: true
          description:
            This is unique cookie, used to identify and the maintain session/state towards the backend system. 
            This value can be obtained from teh GET /session-cookie operation. 
            Example value - "JSESSIONID=rvUKhWtBRaC3zuyv_KxKQQmFq4tI0wla2D--0OBC46QKBGT4cMwI" 
          type: string
        - name: siteId
          in: query
          required: true
          type: string
          description:
            ATG is capable of handling multisite operations. Each site can have different catalog data, pricelist etc.
            This parameter indicates which site the response must be given. Sample values  MTNSite, OnlineStore, EBU_CC, EBU_SME
        - name: id
          in: path
          required: true
          type: string
          description: This parameter represnts the DEP serviceId which must be queried
      
      responses:
        '200':
          description: 'Success'
          schema:
            $ref: "#/definitions/productConfigurationResponse"
        '400':
          description: "Bad Request"
          schema:
            $ref: "#/definitions/Error"
        '401':
          description: "Unauthorized"
          schema:
            $ref: "#/definitions/Error"
        '403':
          description: "Forbidden"
          schema:
            $ref: "#/definitions/Error"
        '404':
          description: "Customer not found"
          schema:
            $ref: "#/definitions/Error"
        '405':
          description: "Method Not allowed"
          schema:
            $ref: "#/definitions/Error"
        '500':
          description: "Internal Server Error"
          schema:
            $ref: "#/definitions/Error"

  /products/{customerId}/productCheckBalance:
    get:
      operationId: getAllTypesOfbalances
      summary: Get All Type of balance for a subscriber product
      description: View the list of all types of product balances for a subscriber.
      tags:
        - products
      parameters:
        - name: "customerId"
          in: path
          description: Customer Msisdn. The format must be E.123 e.g 2319062058464
          required: true
          type: string
        - name: "productType"
          in: "query"
          type: "string"
          required: true
          enum:
            - Normal
            - Bundle
          description: "Specify the type of product request. e.g Normal product."
        - name: "appCpid"
          in: query
          description: appId of the product to fetch.
          required: false
          type: string
        - name: "productId"
          in: query
          description: Id of the product to fetch.
          required: false
          type: string
        - name: "nodeId"
          required: false
          type: string
          in: "query"
          description: "Third parties unique identifier. Can also be called channelId or iname"
        - name: transactionId
          in: header
          type: string
          description: Client generated Id to include for tracing requests, so that the API can easily trace the HTTP request all the way from a client to MTNs backend processes (via our proxies). Each time a request is made to an MTN API the client should include a unique request reference in the HTTP Header. The value must be between 5 and 20 characters, and consist of ASCII letters, digits. Invalid or blank IDs will be ignored and replaced with generated ones. MTN may use this to detect duplicate transactions from the client, but this functionality is not always guaranteed, so clients must make their own efforts to prevent duplicate transactions. MTN will also log the transactionId in order to assist with debugging and to correlate transactions processed by the API to requests from the client.
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/checkBalanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
        "405":
          description: Method No Allowed
          schema:
            $ref: '#/definitions/Error'
        "406":
          description: Not acceptable
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Unsupported media Type
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Error'

definitions:

  Response_ProductOffering:
    type: object
    required:
      - statusCode
      - statusMessage
      - supportMessage
      - Offers
      - topOffers
    properties:
      statusCode:
        type: string
        description: Result code. Example- '0000'
      statusMessage:
        type: string
        description: Result message. Example- 'Successfully processed'
      supportMessage:
        type: string
        description: Description message for Support teams
      transactionId:
        type: string
        description: Transaction id returned by the provider system.
      sequenceNo:
        type: string
        description: This is the MADAPI unique transaction ID to be used for tracing purposes
        example: "12345"
      cookie:
        type: string
        description: cookie returned by ATG system
        example: OK7ak-pwrjXi13OXOLm
      Offers:
        type: array
        items:
          $ref: '#/definitions/ProductOffering'
      topOffers:
        type: array
        items:
          $ref: '#/definitions/ProductOffering'
      _link:
        type: object
        properties:
          self:
            type: object
            properties:
              href:
                type: string
                example: "https://api.mtn.com/v1/productOffering"
  roamingProductOffering:
    type: object
    required:
      - statusCode
      - statusMessage
      - supportMessage
      - transactionId
      - roamingProducts
    properties:
      statusCode:
        type: string
        description: Result code. Example- '0000'
      statusMessage:
        type: string
        description: Result message. Example- 'Successfully processed'
      supportMessage:
        type: string
        description: Description message for Support teams
      transactionId:
        type: string
        description: Transaction id returned by the provider system.
      sequenceNo:
        type: string
        description: This is the MADAPI unique transaction ID to be used for tracing purposes
        example: "12345"
      data:
        type: array
        items:
          $ref: '#/definitions/roamingProducts'
  
  roamingProducts:
    type: object
    description: >-
      Displays the roaming bundles that are available for the country and subscriber type.
    properties:
      zone:
        type: string
        description: provides the zone number.
        example: '1'
      bundle:
        type: string
        description: Provides the bundle details.
        example: '50MB valid for 3 days'
      price:
        type: integer
        description: Provides the price value of the bundle.
        example: 49
      validity:
        type : string
        description : Provides the validity of the bundle.
        example: '3 days'
      recurring:
        type: string
        example: 'once-off'
        description: Provides information about recurring.
      countryCode:
        type: string
        description: Provides the country code.
        example: 'AU'
      countryName:
        type: string
        description: Provides the country code.
        example: 'Australia'
      operatorId:
        type: string
        description: Provides unique operator id. This is only limited to country list response.
        example: '564'
      operatorName:
        type: string
        description: Provides the operator name.
        example: 'MTN'
      chargable:
        type: string
        description: Return true or false, based on information if the bundle is free or chargable
        example: 'true'
      IBF_SERVICE_OPTION_ID:
        type : string
        description : Provides the unique service id w.r.t IBF system..
        example: '3134'
      SORB_PRODUCT_CODE:
        type: string
        description: Provides the unique product id w.r.t SORB system.
        example: 'DTRMNG50Z1'
      SAAE_PRODUCT_ID:
        type: string
        description: Provides unique product id
        example: 'Z1D3D50MB'
      kamlSupport:
       type: string
       description: Provides support details. This is only limited to country list response.
       example: 'Y'
  
  Money:
    type: object
    description: A base / value business entity used to represent money
    properties:
      unit:
        type: string
        description: Currency (ISO4217 norm uses 3 letters to define the currency)
      value:
        type: number
        format: float
        description: A positive floating point number

  ProductOffering:
    type: object
    description: >-
      Represents entities that are orderable from the provider of the catalog,
      this resource includes pricing information.
    properties:
      id:
        type: string
        description: Unique identifier of the productOffering
      offerRank:
        type: integer
        description: This parameter holds the ranking of the offer. The ranking defines the popularity of the deal.
      offerPrice:
        $ref : "#/definitions/Money"
      href:
        type: string
        description: Reference of the ProductOffering
      description:
        type: string
        description: Description of the productOffering
      simOnly:
        type: boolean
        description: returns true or false, based on specification of offer
      name:
        type: string
        description: Name of the productOffering
      statusReason:
        type: string
        description: >-
          A string providing a complementary information on the value of the
          lifecycle status attribute.
      version:
        type: string
        description: ProductOffering version
      offerProductId:
        type: string
        description: Represents the productId of the offer.
      duration:
        type: string
        description: Represents the duration of the offer (For example :1 month)
      yelloTraderId:
        type: string
        description: Represents the duration of the offer (For example :2018462 CT212)
      prodSpecCharValueUse:
        type: array
        items:
          $ref: '#/definitions/ProductSpecificationCharacteristicValueUse'
        description: >-
          A use of the ProductSpecificationCharacteristicValue by a
          ProductOffering to which additional properties (attributes) apply or
          override the properties of similar properties contained in
          ProductSpecificationCharacteristicValue. It should be noted that
          characteristics which their value(s) addressed by this object must
          exist in corresponding product specification. The available
          characteristic values for a ProductSpecificationCharacteristic in a
          Product specification can be modified at the ProductOffering level.
          For example, a characteristic 'Color' might have values White, Blue,
          Green, and Red. But, the list of values can be restricted to e.g.
          White and Blue in an associated product offering. It should be noted
          that the list of values in
          'ProductSpecificationCharacteristicValueUse' is a strict subset of the
          list of values as defined in the corresponding product specification
          characteristics.
      productOfferingAdditionalAttributes:
        type: array
        items:
          $ref: '#/definitions/ProductOfferingTerm'
        description: >-
          A condition under which a ProductOffering is made available to
          Customers. For instance, a productOffering can be offered with
          multiple commitment periods.
      validFor:
        $ref: '#/definitions/TimePeriod'
        description: The period for which the productOffering is valid
  TimePeriod:
    type: object
    description: >-
      A period of time, either as a deadline (endDateTime only) a startDateTime
      only, or both
    properties:
      endDateTime:
        type: string
        format: date-time
        description: 'End of the time period, using IETC-RFC-3339 format'
      startDateTime:
        type: string
        format: date-time
        description: >-
          Start of the time period, using IETC-RFC-3339 format. If you define a
          start, you must also define an end

  ProductOfferingTerm:
    $ref: '#/definitions/Freebies'
    description: >-
      Contains Offer Freebies details

  Freebies:
    type: object
    description: Displays the freebies associated with the plan
    properties:
      id:
        type: string
        description: Unique identifier of a related entity. This can be product id or offer id etc.
      name:
        type: string
        description: Name of the related entity. This can be product name or offer name etc.
      type:
        type: string
        description: Type of a product or offer,e.g., Data, SMS, Voice etc.
      validity:
        type : string
        description : Validity of a product or offer.
      planPrice:
        $ref: "#/definitions/Money"

  ProductSpecificationCharacteristicValueUse:
    type: object
    description: >-
      A use of the ProductSpecificationCharacteristicValue by a ProductOffering
      to which additional properties (attributes) apply or override the
      properties of similar properties contained in
      ProductSpecificationCharacteristicValue. It should be noted that
      characteristics which their value(s) addressed by this object must exist
      in corresponding product specification. The available characteristic
      values for a ProductSpecificationCharacteristic in a Product specification
      can be modified at the ProductOffering level. For example, a
      characteristic 'Color' might have values White, Blue, Green, and Red. But,
      the list of values can be restricted to e.g. White and Blue in an
      associated product offering. It should be noted that the list of values in
      'ProductSpecificationCharacteristicValueUse' is a strict subset of the
      list of values as defined in the corresponding product specification
      characteristics.
    properties:
      description:
        type: string
        description: >-
          A narrative that explains in detail what the
          productSpecificationCharacteristic is
      deviceSize:
        type: integer
        description: >-
          The maximum number of instances a CharacteristicValue can take on. For
          example, zero to five phone numbers in a group calling plan, where
          five is the value for the maxCardinality.
      deviceSizeUOM:
        type: string
        description: Device Size UOM
      name:
        type: string
        description: Name of the associated productSpecificationCharacteristic
      deviceBrandName:
        type: string
        description: >-
          Gives brand name and specifications
      deviceRank:
        type: integer
        description: This parameter holds the ranking of the device. The ranking defines the popularity of the device
      devicePrice:
        $ref: '#/definitions/Money'
      deviceType:
        type: string
        description: >-
          Gives device type details, e.g.Laptop
      productSpecCharacteristicValue:
        type: array
        items:
          $ref: '#/definitions/ProductSpecificationCharacteristicValue'
        description: >-
          A number or text that can be assigned to a
          ProductSpecificationCharacteristic.
      productSpecification:
        $ref: '#/definitions/ProductSpecificationRef'
        description: >-
          A ProductSpecification is a detailed description of a tangible or
          intangible object made available externally in the form of a
          ProductOffering to customers or other parties playing a party role.
      validFor:
        $ref: '#/definitions/TimePeriod'
        description: The period for which the productSpecificationCharacteristic is valid

  ProductSpecificationRef:
    type: object
    properties:
      id:
        type: string
        description: Unique identifier of a related entity. This can be product id or offer id etc.
      name:
        type: string
        description: Name of the related entity. This can be product name or offer name etc.
      type:
        type: string
        description: Type of a product or offer,e.g., Data, SMS, Voice etc.
      validity:
        type : string
        description : Validity of a product or offer.
      planPrice:
        $ref: "#/definitions/Money"
      planSize:
        type : string
        description : Gives plan size
      planFreebies:
        $ref: "#/definitions/Freebies"


  ProductSpecificationCharacteristicValue:
    type: object
    description: >-
      A ProductSpecificationCharacteristicValue object is used to define a set
      of attributes, each of which can be assigned to a corresponding set of
      attributes in a ProductSpecificationCharacteristic object. The values of
      the attributes in the ProductSpecificationCharacteristicValue object
      describe the values of the attributes that a corresponding
      ProductSpecificationCharacteristic object can take on.
    properties:
      deviceColor:
        type: string
        description: Describes the colour of the device
      deviceColorCode:
        type: string
        description: Describes the colour code of the device
      deviceSkuId:
        type: string
        description: >-
          This is unique id which references stock keeping unit.
      imageURL:
        type: string
        description: Image URL
      lowStock:
        type: boolean
        description: This parameter indicates whether stock level is below threshold or not.



  ProductInfo:
    type: object
    properties:
      expiryTime:
        type: "string"
        description: "Offer Expire Time"
        example: "2019-06-20 23:59:00 +0100"
      message:
        type: "string"
        description: "Offer Description"
        example: "Get 4GB Data for as low as N1,000 only. Data is valid for 7days. Press\nAccept to activate"
      messageLanguage:
        type: "string"
        description: ""
        example: "English (UK)"
      messageEncoding:
        type: "string"
        description: ""
        example: "UTF-8"
      id:
        type: "integer"
        description: "Identifies the product. This must be an echoed back input from the 3pp"
        example: "1565"
      category:
        type: "string"
        description: "Offer Category"
        example: "Bundle"
      offerType:
        type: "string"
        description: ""
        example: "usage or recharge"
      order:
        type: "string"
        description: ""
        example: "Bundle"
      description:
        type: string
        description: "A description of the offer"
        example: 'SWZ_Data_109200'
      additionalParams:
        type: object
        description: "More params"
        properties:
          offerPrice:
            type: "string"
            description: ""
            example: "1000"
          offerId:
            type: "string"
            description: "This field <offerId > shows the offer Id of the provisioned product"
            example: "11015"
          accountId:
            type: integer
            description: "Account Identifies"
            example: 213
          rewardValidity:
            type: "string"
            description: ""
            example: "7"
          productId:
            type: "string"
            description: "Unique Product Id defined in CIS database."
            example: "RACT_NG_Data_213"
      shortMessage:
        type: "string"
        description: "Short message to describe the offer"
        example: ""


  OfferCategory:
    type: array
    example: >-
      "Topdeal",
      "Recharge",
      "DataBundle",
      "Combo",
      "Voice",
      "VAS"
    items:
      type: string


  OfferCategoryResponse:
    type: object
    properties:
      statusCode:
        type: string
        description: HTTP Error code extension
        example: "0000"
      statusMessage:
        type: string
        example: "Success"
      transactionId:
        type: string
        description: This is the same transactionId that is sent in the request
      sequenceNo:
        type: string
        description: This is the MADAPI unique transaction ID to be used for tracing purposes
        example: "12345"
      data:
        type: array
        items:
          $ref: '#/definitions/OfferCategory'
      _link:
        type: object
        properties:
          self:
            type: object
            properties:
              href:
                type: string
                example: "https://api.mtn.com/v1/products/2348064816493/category"


  OfferResponse:
    type: object
    properties:
      statusCode:
        type: string
        description: HTTP Error code extension
        example: "0000"
      statusMessage:
        type: string
        example: "Success"
      transactionId:
        type: string
        description: This is the same transactionId that is sent in the request
      sequenceNo:
        type: string
        description: This is the MADAPI unique transaction ID to be used for tracing purposes
        example: "12345"
      data:
        type: array
        items:
          $ref: '#/definitions/ProductInfo'
      _link:
        type: object
        properties:
          self:
            type: object
            properties:
              href:
                type: string
                example: "https://api.mtn.com/v1/products/2348064816493/eligible"


  ProductCatalogue:
    type: "object"
    required:
      - "statusCode"
      - "customerId"
      - "data"
      - "_links"
    properties:
      statusCode:
        type: string
        example: "0000"
      customerId:
        type: "string"
      statusMessage:
        type: string
        description: "This is a description of the status message"
      transactionId:
        type: string
        description: "Generated transaction Id"
      sequenceNo:
        type: string
        description: This is the MADAPI unique transaction ID to be used for tracing purposes
        example: "12345"
      data:
        type: "object"
        description: "The data envelope containing the voice, data and yolo information"
        $ref: "#/definitions/Data"

  Links:
    type: "object"
    required:
      - "self"
    properties:
      self:
        type: "object"
        required:
          - "href"
        description: ""
        properties:
          href:
            type: "string"
            description: ""

  Data:
    type: "object"
    required:
      - "voice"
      - "data"
      - "yolo"
      - "music"
      - "stream"
      - "others"
    properties:
      MABand:
        type: string
        description: This is a band defined to show the range of the MSISDN Main Account. E.g. A.<br/>where the MSISDN MA is > 0 <= 1000. Available when filterByMABand is TRUE."
        example: "A"
      combinedBand:
        type: string
        description: This is a band defined to show the range of the MSISDN Positive Main Account added with the DAAccount balance. E.g. A.<br/>where the MSISDN MA is > 0 <= 1000. Available when filterByMABand is TRUE."
        example: "A"
      providerRef:
        type: string
        description: "Reference number from the payment channel"
      traceId:
        type: string
        description: "String provided by Lumos. Should be returned by Payment Provider in the notification API. Up to 50 characters"
      customerName:
        type: string
        description: "Name of the  customer the payment is done for"
      voice:
        type: "object"
        description: "the voice products available"
        $ref: "#/definitions/ProductFrequency"
      data:
        type: "object"
        description: "the data products available"
        $ref: "#/definitions/ProductFrequency"
      yolo:
        type: "object"
        description: "the yolo products available"
        $ref: "#/definitions/ProductFrequency"
      music:
        type: "object"
        description: "the music products available"
        $ref: "#/definitions/ProductFrequency"
      stream:
        type: "object"
        description: "the stream products available"
        $ref: "#/definitions/ProductFrequency"
      others:
        type: "object"
        description: "a generic category of products available"
        $ref: "#/definitions/OthersProductFrequency"

  ProductFrequency:
    type: "object"
    required:
      - "_link"
    properties:
      daily:
        type: "array"
        description: "The daily products of this type"
        items:
          $ref: "#/definitions/Product"
      weekly:
        type: "array"
        description: "The weekly products of this type"
        items:
          $ref: "#/definitions/Product"
      monthly:
        type: "array"
        description: "The monthly products of this type"
        items:
          $ref: "#/definitions/Product"
      days:
        type: "array"
        description: "Other products that don't strictly fall into the above periods"
        items:
          $ref: "#/definitions/Product"
      _link:
        type: "string"
        description: "The link to retrieve the products for this type."
        $ref: "#/definitions/Links"
        example: "https://api.mtn.com/v1/products/27832000000?type=Voice"

  OthersProductFrequency:
    type: "object"
    required:
      - "_link"
    properties:
      daily:
        type: "array"
        description: "The daily products of this type"
        items:
          $ref: "#/definitions/Product"
      weekly:
        type: "array"
        description: "The weekly products of this type"
        items:
          $ref: "#/definitions/Product"
      monthly:
        type: "array"
        description: "The monthly products of this type"
        items:
          $ref: "#/definitions/Product"
      days:
        type: "array"
        description: "Other products that don't strictly fall into the above periods"
        items:
          $ref: "#/definitions/Product"
      otherProducts:
        type: "array"
        description: "Other products that cannot be categorized by any of the above frequencies"
        items:
          $ref: "#/definitions/OtherProduct"
      _link:
        type: "string"
        description: "The link to retrieve the products for this type."
        $ref: "#/definitions/Links"
        example: "https://api.mtn.com/v1/products/27832000000?type=Voice"

  ProductBundlePrice:
    type: object
    required:
      - "statusCode"
    properties:
      statusCode:
        type: string
        example: "0000"
      customerId:
        type: string
      sequenceNo:
        type: string
        description: This is the MADAPI unique transaction ID to be used for tracing purposes
        example: "12345"
      data:
        example: {
          "id": "97",
          "name": "Daily bundle of 15MB",
          "currency": "UGX",
          "amount": 250,
          "bundleCategory": "3G Bundle Daily",
          "bundleType": "DATA",
          "bundleValidaty": "1 Days",
          "_link": {"self": {"href": "string"}}}

  Product:
    type: "object"
    required:
      - "id"
      - "name"
      - "amount"
    description: "The product a customer can purchase."
    properties:
      id:
        type: "string"
        description: "Identifies the product. This must be an echoed back input from the 3pp"
        example: "97"
      name:
        type: "string"
        description: "The name of the product."
        example: "5,000Frw(7GB)/30Days"
      currency:
        type: "string"
        description: "ISO 4217 Three-letter ISO code for the currency."
        example: "RWF"
      amount:
        type: number
        description: "The amount that the product will cost"
        example: 5000
      bundleCategory:
        type: "string"
        description: "The category of the bundle"
        example: "3G Bundles Daily"
      bundleType:
        type: "string"
        description: "The type of the bundle"
        example: "DataBundle"
      bundleValidity:
        type: "string"
        description: "The period this product is valid for"
        example: "14 days"
      bundleValue:
        type: object
        properties:
