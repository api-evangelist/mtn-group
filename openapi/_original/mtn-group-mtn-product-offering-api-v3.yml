                      items:
                        type: object
                        properties:
                          notifyChannel:
                            type: string
                            description: 'This indicates if on succesful purchase of bundle
                              which channel has to notify. '
                          offerType:
                            type: string
                            description: This is the type of "offer" being requested by the
                              service.  Currently it can be set to one of the following; "myMTN
                              Offers","Summer Surprise" or "Recharge Rewards".
                          offerCategory:
                            type: string
                            description: When "offerType" is set to "myMTN Offers", this value
                              can be one of the following; "All", "myMTN Data", "myMTN Voice"
                              or "myMTN Social".  When its set to "Recharge Rewards"  this value
                              does not have to be passed.  If this value is not passed for any
