                        if the subscriber is prepaid, postpaid, Coverged, hybrid etc. The channels
                        will be sending the value if they have the context of the subscriber's
                        msisdn if it is prepaid or postpaid.The values are 'P' for prepaid ,'C'
                        for postpaid, 'H' for hybrid, 'V' for converged
                    description:
