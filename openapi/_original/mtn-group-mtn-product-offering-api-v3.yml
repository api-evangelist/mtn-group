                      description: This is the unique bundle id which can be obtained from the
                        GET "mtnOffer" V7 service - its the "offerId" field
                    price:
                      type: string
                      description: Price of the bundle which can be obtained from the GET "mtnOffer"
                        V7 service - its the "offerPrice" field
                    priceUOM:
                      type: string
                      description: This is currently always set as "R", as the GET "mtnOffer" V7 service doesn't returne the price UOM.
                    services:
