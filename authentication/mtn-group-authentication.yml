documented_model:
  madapi:
    flow: oauth2 client_credentials
    token_url: https://api.mtn.com/v1/oauth/access_token?grant_type=client_credentials
    token_request: POST application/x-www-form-urlencoded, body client_id={consumer-key}&client_secret={consumer-secret}
    token_type: BearerToken
    expires_in_seconds: 3599
    scope: empty in the documented token response
    call_headers:
    - 'Authorization: Bearer {access_token}'
    - 'x-api-key: {consumer key}'
    - transactionID (traceability, required by some products)
    credential_source: the My Apps section of https://developers.mtn.com/apps
  momo:
    flow: subscription key + provisioned API user/key exchanged for a bearer token
    headers:
    - Ocp-Apim-Subscription-Key
    - 'Authorization: Bearer {token}'
    - X-Target-Environment
    - X-Reference-Id
    - X-Callback-Url
    key_pages:
      sandbox: https://momodeveloper.mtn.com/profile
      production: https://momoapi.mtn.com/profile
    note: primary and secondary subscription keys are issued per product and never expire; the sandbox API user/key
      pair is provisioned through the Sandbox Provisioning API
