- code: RESOURCE_ALREADY_EXIST
  group: momo
  description: Duplicated reference id. Every request must carry a unique reference id; reusing a previous id returns
    this error.
  http_status: 409
  action: Check the X-Reference-Id is unique and in UUID v4 format
  surface: MoMo Open API
- code: ACCESS DENIED DUE TO INVALID SUBSCRIPTION KEY
  group: momo
  description: Authentication failed. The Ocp-Apim-Subscription-Key header value is incorrect.
  http_status: 401
  action: Collection, Disbursement and Remittance have different subscription keys; try the secondary key, then
    contact MTN support
  surface: MoMo Open API
- code: RESOURCE NOT FOUND
  group: momo
  description: Reference id not found. Occurs mostly on status GETs and implies the reference id does not exist.
  http_status: 404
  action: Confirm the originating request to pay / transfer was accepted with 202
  surface: MoMo Open API
- code: REQUEST REJECTED/ BAD REQUEST
  group: momo
  description: 'Request does not follow the specification: bad header values, X-Reference-Id not UUID v4, a body
    sent to an API that takes none, unsupported special characters such as an apostrophe, invalid currency for the
    target environment, note/message longer than 160 characters, or a malformed URL.'
  http_status: 400
  action: Validate headers, id format, currency and payload length
  surface: MoMo Open API
- code: FORBIDDEN IP
  group: momo
  description: Authorization failed. Calling IP is not authorised to use the Disbursement API.
  http_status: 403
  action: Share the originating public IP with the MTN Account Manager
  surface: MoMo Open API
- code: NOT_ALLOWED
  group: momo
  description: Authorization failed. The account authenticated via the token is restricted.
  http_status: 500
  action: Contact the MTN Account Manager
  surface: MoMo Open API
- code: NOT_ALLOWED_TARGET_ENVIRONMENT
  group: momo
  description: The X-Target-Environment header value is incorrect.
  http_status: 500
  action: 'Use the country target environment: mtnuganda, mtnghana, mtnivorycoast, mtnzambia, mtncameroon, mtnbenin,
    mtncongo, mtnswaziland, mtnguineaconakry, mtnsouthafrica, mtnliberia, mtnsouthsudan, mtnnigeria, mtnrwanda;
    or sandbox for test'
  surface: MoMo Open API
- code: INVALID_CALLBACK_URL_HOST
  group: momo
  description: The callback URL host differs from the host configured for the API user.
  http_status: 500
  action: Callback host must match the providerCallbackHost registered when the API user was created, and must be
    a hostname not an IP
  surface: MoMo Open API
- code: INVALID_CURRENCY
  group: momo
  description: Currency not supported on the requested account.
  http_status: 500
  action: Use the currency code specific to the country
  surface: MoMo Open API
- code: SERVICE_UNAVAILABLE
  group: momo
  description: Service temporarily unavailable.
  http_status: 503
  action: Retry later or contact MTN support
  surface: MoMo Open API
